<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Générateur de Rapport de Maintenance</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .status-ok { background-color: #def7ec; color: #03543f; font-weight: bold; }
        .status-nok { background-color: #fde8e8; color: #9b1c1c; font-weight: bold; }
        .zone-header { background-color: #f3f4f6; font-weight: bold; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen p-4 md:p-8">

    <div class="max-w-7xl mx-auto bg-white rounded-xl shadow-md p-6">
        
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6 p-4 bg-gray-50 rounded-lg border border-gray-200">
            <div>
                <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Client / Site</label>
                <input type="text" id="headerSite" class="w-full bg-white border border-gray-300 rounded px-3 py-2 text-sm focus:outline-blue-500" placeholder="Ex: Site Paris">
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Intervenant / Technicien</label>
                <input type="text" id="headerIntervenant" class="w-full bg-white border border-gray-300 rounded px-3 py-2 text-sm focus:outline-blue-500" placeholder="Nom du technicien">
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Marque du Parc</label>
                <select id="headerBrand" class="w-full bg-white border border-gray-300 rounded px-3 py-2 text-sm focus:outline-blue-500">
                    <option value="Zebra">Zebra</option>
                    <option value="Honeywell">Honeywell</option>
                    <option value="Toshiba">Toshiba</option>
                    <option value="Intermec">Intermec</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Date d'intervention</label>
                <input type="date" id="headerDate" class="w-full bg-white border border-gray-300 rounded px-3 py-2 text-sm focus:outline-blue-500">
            </div>
        </div>

        <form id="machineForm" class="bg-gray-50 p-4 rounded-lg border border-gray-200 mb-6 grid grid-cols-1 md:grid-cols-4 gap-4">
            <div class="md:col-span-4">
                <h3 class="text-sm font-bold text-blue-950 uppercase border-b pb-1 mb-2">Ajouter une machine au rapport</h3>
            </div>
            
            <div>
                <label class="block text-xs font-medium text-gray-700 mb-1">Zone / Emplacement</label>
                <input type="text" id="zone" class="w-full bg-white border border-gray-300 rounded px-3 py-1.5 text-sm" placeholder="Ex: Expédition" required>
            </div>
            <div>
                <label class="block text-xs font-medium text-gray-700 mb-1">Modèle</label>
                <input type="text" id="modele" class="w-full bg-white border border-gray-300 rounded px-3 py-1.5 text-sm" placeholder="Ex: ZT411" required>
            </div>
            <div>
                <label class="block text-xs font-medium text-gray-700 mb-1">Numéro de Série</label>
                <input type="text" id="serial" class="w-full bg-white border border-gray-300 rounded px-3 py-1.5 text-sm" placeholder="S/N" required>
            </div>
            <div>
                <label class="block text-xs font-medium text-gray-700 mb-1">Machine ID / Nom</label>
                <input type="text" id="lieuId" class="w-full bg-white border border-gray-300 rounded px-3 py-1.5 text-sm" placeholder="ID Interne">
            </div>
            <div>
                <label class="block text-xs font-medium text-gray-700 mb-1">Adresse IP</label>
                <input type="text" id="ip" class="w-full bg-white border border-gray-300 rounded px-3 py-1.5 text-sm" placeholder="192.168.x.x">
            </div>

            <div>
                <label class="block text-xs font-medium text-gray-700 mb-1">Cellules / Capteurs</label>
                <select id="cellules" class="w-full bg-white border border-gray-300 rounded px-3 py-1.5 text-sm">
                    <option value="OK">OK</option>
                    <option value="NOK">NOK</option>
                    <option value="-">-</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-medium text-gray-700 mb-1">État Dot (Tête)</label>
                <select id="etatDot" class="w-full bg-white border border-gray-300 rounded px-3 py-1.5 text-sm">
                    <option value="OK">OK</option>
                    <option value="1 Dot HS">1 Dot HS</option>
                    <option value="2 Dots HS">2 Dots HS</option>
                    <option value="Plusieurs Dots HS">Plusieurs Dots HS</option>
                    <option value="Tête HS">Tête HS</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-medium text-gray-700 mb-1">Roller / Rouleau</label>
                <select id="roller" class="w-full bg-white border border-gray-300 rounded px-3 py-1.5 text-sm">
                    <option value="OK">OK</option>
                    <option value="Marqué">Marqué</option>
                    <option value="À remplacer">À remplacer</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-medium text-gray-700 mb-1">Test Impression</label>
                <select id="impression" class="w-full bg-white border border-gray-300 rounded px-3 py-1.5 text-sm">
                    <option value="OK">OK</option>
                    <option value="NOK">NOK</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-medium text-gray-700 mb-1">État Général</label>
                <select id="general" class="w-full bg-white border border-gray-300 rounded px-3 py-1.5 text-sm">
                    <option value="OK">OK</option>
                    <option value="A surveiller">A surveiller</option>
                    <option value="Critique">Critique</option>
                </select>
            </div>

            <div class="md:col-span-2">
                <label class="block text-xs font-medium text-gray-700 mb-1">Remarques / Actions menées</label>
                <textarea id="remarque" rows="2" class="w-full bg-white border border-gray-300 rounded px-3 py-1 text-sm" placeholder="Nettoyage, changement de pièce..."></textarea>
            </div>

            <div class="md:col-span-2">
                <label class="block text-xs font-medium text-gray-700 mb-1">Photo (Optionnelle)</label>
                <input type="file" id="photoInput" accept="image/*" class="w-full text-xs text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
                <div id="photoPreviewContainer" class="mt-2 hidden">
                    <img id="photoPreview" src="" class="h-20 w-auto rounded border shadow-sm">
                </div>
            </div>

            <div class="md:col-span-4 flex justify-end gap-2 mt-2">
                <button type="submit" class="bg-blue-900 hover:bg-blue-950 text-white font-bold text-sm px-6 py-2 rounded shadow cursor-pointer">
                    Ajouter au tableau
                </button>
            </div>
        </form>

        <div class="flex flex-col sm:flex-row justify-between items-center bg-gray-100 p-4 rounded-lg mb-4 gap-4">
            <div class="text-sm font-medium text-gray-700">
                Machines enregistrées : <span id="machineCount" class="font-bold text-blue-900">0</span>
            </div>
            <button id="exportBtn" class="bg-green-700 hover:bg-green-800 text-white font-bold text-sm px-6 py-2 rounded shadow flex items-center gap-2 cursor-pointer">
                💾 Exporter en format Word (.doc)
            </button>
        </div>

        <div class="overflow-x-auto border border-gray-200 rounded-lg">
            <table class="min-w-full divide-y divide-gray-200 text-sm text-center">
                <thead class="bg-blue-950 text-white text-xs uppercase font-bold">
                    <tr>
                        <th class="px-3 py-3 text-left">Modèle</th>
                        <th class="px-3 py-3">S/N</th>
                        <th class="px-3 py-3">ID</th>
                        <th class="px-3 py-3">IP</th>
                        <th class="px-3 py-3">Cellules</th>
                        <th class="px-3 py-3">Tête</th>
                        <th class="px-3 py-3">Roller</th>
                        <th class="px-3 py-3">Impression</th>
                        <th class="px-3 py-3">Général</th>
                        <th class="px-3 py-3 text-left">Remarques</th>
                        <th class="px-3 py-3">Photo</th>
                        <th class="px-3 py-3">Actions</th>
                    </tr>
                </thead>
                <tbody id="reportTableBody" class="bg-white divide-y divide-gray-200">
                    <tr><td colspan="12" class="px-6 py-4 text-gray-500 text-center italic">Aucune machine dans le rapport pour le moment.</td></tr>
                </tbody>
            </table>
        </div>

    </div>

    <script>
        let reportData = [];
        let currentPhotoBase64 = null;

        // Date du jour par défaut
        document.getElementById('headerDate').value = new Date().toISOString().split('T')[0];

        // Capture de l'image
        document.getElementById('photoInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    currentPhotoBase64 = event.target.result;
                    const preview = document.getElementById('photoPreview');
                    preview.src = currentPhotoBase64;
                    document.getElementById('photoPreviewContainer').classList.remove('hidden');
                };
                reader.readAsDataURL(file);
            }
        });

        function formatRemarqueHTML(text) {
            if (!text) return "";
            return text.replace(/\n/g, "<br>");
        }

        // Soumission
        document.getElementById('machineForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const machine = {
                idKey: Date.now(),
                zone: document.getElementById('zone').value.trim(),
                modele: document.getElementById('modele').value.trim(),
                serial: document.getElementById('serial').value.trim(),
                lieuId: document.getElementById('lieuId').value.trim(),
                ip: document.getElementById('ip').value.trim(),
                cellules: document.getElementById('cellules').value,
                etatDot: document.getElementById('etatDot').value,
                roller: document.getElementById('roller').value,
                impression: document.getElementById('impression').value,
                general: document.getElementById('general').value,
                remarque: document.getElementById('remarque').value.trim(),
                photos: currentPhotoBase64 ? [currentPhotoBase64] : []
            };

            reportData.push(machine);
            updateTable();
            
            // Reset partiel
            document.getElementById('modele').value = '';
            document.getElementById('serial').value = '';
            document.getElementById('lieuId').value = '';
            document.getElementById('ip').value = '';
            document.getElementById('remarque').value = '';
            document.getElementById('photoInput').value = '';
            document.getElementById('photoPreviewContainer').classList.add('hidden');
            currentPhotoBase64 = null;
        });

        // Rendu du tableau dynamique
        function updateTable() {
            const tbody = document.getElementById('reportTableBody');
            tbody.innerHTML = '';
            document.getElementById('machineCount').innerText = reportData.length;

            if (reportData.length === 0) {
                tbody.innerHTML = `<tr><td colspan="12" class="px-6 py-4 text-gray-500 text-center italic">Aucune machine dans le rapport pour le moment.</td></tr>`;
                return;
            }

            const zones = [...new Set(reportData.map(item => item.zone))];

            zones.forEach(z => {
                if (z !== "") {
                    const zoneRow = document.createElement('tr');
                    zoneRow.className = "zone-header";
                    zoneRow.innerHTML = `<td colspan="12" class="px-3 py-2 text-left text-xs tracking-wider text-gray-700 uppercase bg-gray-100 font-bold">${z}</td>`;
                    tbody.appendChild(zoneRow);
                }

                const zoneData = reportData.filter(item => item.zone === z);
                zoneData.forEach(d => {
                    const row = document.createElement('tr');
                    row.className = "hover:bg-gray-50 text-xs";

                    const cellClass = d.cellules === 'NOK' ? 'status-nok' : 'status-ok';
                    const dotClass = d.etatDot !== 'OK' ? 'status-nok' : 'status-ok';
                    const rollerClass = d.roller !== 'OK' ? 'status-nok' : 'status-ok';
                    const impClass = d.impression === 'NOK' ? 'status-nok' : 'status-ok';
                    const genClass = d.general !== 'OK' ? 'status-nok' : 'status-ok';

                    let photoPreviewHtml = d.photos && d.photos.length > 0 ? 
                        `<img src="${d.photos[0]}" class="h-10 w-12 object-cover rounded mx-auto border">` : '-';

                    row.innerHTML = `
                        <td class="px-3 py-2 text-left font-semibold text-gray-900">${d.modele}</td>
                        <td class="px-3 py-2 text-gray-600">${d.serial}</td>
                        <td class="px-3 py-2">${d.lieuId || '-'}</td>
                        <td class="px-3 py-2 font-mono text-gray-500">${d.ip || '-'}</td>
                        <td class="px-3 py-2 ${cellClass}">${d.cellules}</td>
                        <td class="px-3 py-2 ${dotClass}">${d.etatDot}</td>
                        <td class="px-3 py-2 ${rollerClass}">${d.roller}</td>
                        <td class="px-3 py-2 ${impClass}">${d.impression}</td>
                        <td class="px-3 py-2 ${genClass}">${d.general}</td>
                        <td class="px-3 py-2 text-left max-w-xs truncate" title="${d.remarque}">${formatRemarqueHTML(d.remarque) || '-'}</td>
                        <td class="px-3 py-2">${photoPreviewHtml}</td>
                        <td class="px-3 py-2">
                            <button onclick="deleteMachine(${d.idKey})" class="text-red-600 hover:text-red-900 font-bold cursor-pointer">Supprimer</button>
                        </td>
                    `;
                    tbody.appendChild(row);
                });
            });
        }

        window.deleteMachine = function(idKey) {
            reportData = reportData.filter(item => item.idKey !== idKey);
            updateTable();
        };

        // Export MHTML / Word sécurisé
        document.getElementById('exportBtn').addEventListener('click', function(e) {
            e.preventDefault();
            if(reportData.length === 0) return alert('Aucune donnée à exporter. Ajoutez des machines d\'abord.');
            
            const site = document.getElementById('headerSite').value || 'N/A';
            const tech = document.getElementById('headerIntervenant').value || 'N/A';
            const brandSelection = document.getElementById('headerBrand').value;
            const dateV = document.getElementById('headerDate').value ? new Date(document.getElementById('headerDate').value).toLocaleDateString('fr-FR') : 'N/A';

            let dynamicSubtitle = "Parc d'imprimantes " + brandSelection;
            let boundary = "NEXT_PART_BOUNDARY_MARKER";

            const logoBase64 = "iVBORw0KGgoAAAANSUhEUgAAALEAAAB4CAIAAAAyrITuAAAAA3NCSVQICAjb4U/gAAAAv3pUWHRSYXcgcHJvZmlsZSB0eXBlIEFQUDEAABiVfU9bDgIxCPzvKfYIU6Cv41Szmk2Mmr3/h9RS3SbGIUA7AQbcdb2v+3Zenvvjst1WtzQQ4KRIoQogo4MBT/Ata+ywzF5f2oRkf+o5lpwgh7qKCUErIkef1HtDC6XPkSHLpKYzKn5poy150DgNnmc+jTvCzFfbiVCl3UDG51E/xlEkjpyjsLBXZ86c1AuH9xv/zUS6Ln3vC6QTsnHz3f7Tp3AvGYVWP2up3jcAACAASURBVHic7X13uF5Vlf67djnnfO32e9MboddQQ1EEUUQd0cGGg4Nj46eOojjqKGMfRx0EewUBFUHKoKMoDOKAIqh0CKRBSK+3f/2Uvdf6/XGTACG5uQkEMsl9n/M8+XLuOWfvffZ79l57tU0igr0THqABqFwTefh+XXmc+q4xK6+npA+07buY2EkatsnE1wXT3kCFV8UR50gRF6BeuLrvUtDeywkIo4+khbIYi96TrP0Lu3WRAfGo9yCAWEEz9cRRLtrnM2rieUmxzWKPocSe05AdB4twEYh4xS/88ltNY11kI7Ad/SaR1EmdfDHwk/N16+d/jpf+UHsH7Dmf1l7MCa9Sn3dUV43f+6iR5cCUiPKj36QUbGBgU59fzWSgHPquNHEvjTbf/B/DXswJgSNw8jc05gUZRwLtRPGoMwcAAZwjia0XFfSlGtS7VOLBPWeU2Ks5oREYuOWP8lDfTj5BQACUAe1Rr3GPasyOQSQEXN8TXK+92FXZvbAXc4LIAWlpOWvBHiQNPHfszZwAA2yzcT5sgb2YEyPYk4TD5wl7PSfG8SyMc2IcW2KcE+PYEuOcGMeWGOfEOLbEOCfGsSXGOTGOLTHOiXFsib2YE1S3qe858OM+mi5+Z1RXlRCBFFF0dfPI8167FxF7Lycc1Yepmvnjcx2TSO/MEwp1q1WtKpaqHXvSe9yT2rJj0Fy0WsOW0rYzhcKdUHJrZRNw4YCPFLpeij3IhXHP9cdkBsQpAZyWgJ7OfmKAkSihmgus1Jt2/tkoP0iNAaGxdi4JmrnJMuuU3JTvUdAG44jMLmrKC4w9lhPeey8imshnSgdPd3shABAWIvaaHFGYNFeY4Tuo7y+ZMkqCsTyfOCtPemmx55UhdbL3Su/U9LNbYo/lRAZ4ZLb3j83ev2W6POKOTUSlIHSZ1Sip1sOk8yXeFKx457SxImhkHGi1HTfdzdBgYU9KCAyEe4wTxh4y3D0bhitqxfWy+FuaHqMM5AGACLBaeQXSZNvUrPdg1r/AtBn4VDRTIeLUY8XYxCwGepiVVhkkJyDaQyix544TqDwiD11Ag3cjl4JpswgpI78I1KQ+FeVP/J/chOMJmqEBaGGh5ti+eCFEIkQkEL0DY4RnePesZwm0g1LMrCggGutYtSuwx44TqCz16/9EIWtnofzmUB7a/A9FadIMs4YgI2wSB0gRCmMvZOPYsCMjhFAG1dzCmUdASRwSbGgVFOFFFU72WE6I1FTAyoacCRnZumc14UVYjZNmHcgzOcHMgpi080oZHb64/bLHcgIE0mBW0DGpF2d+FAhkpPeJlIioRt3NXzCwfEWNRZ4+uJBIVm1OmlI64eTJOs+AvIjiyR7LCSJAQKb5ItYhdSm4miZpznYONBuPPFT+7kULbrp1MVDYmiOovPFNs+Ycized60u7hNmD2WE7sDlLc6yGXwawbUZf71gauuujNnpllqy8Rt2esEiGlSu8PiZY/mhOgjxghaYbvAgM8B1ijHyHznR/9lttv+ckUUHOw8E0oR79bLvT2WExlDFEKKvPeKaMsYXwFMZnOdPl8kHxLaldEgMUDN1Iuhb17yeO+Xff6IDpAitclN0ZmeFEPofXp3JgT2YBtYZpXfepAwwTUT7G             let mhtml = `MIME-Version: 1.0\nContent-Type: multipart/related; boundary="${boundary}"\n\n`;
            mhtml += `--${boundary}\nContent-Type: text/html; charset="utf-8"\n\n`;

            let wordHtml = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">
            <head>
            <meta charset="utf-8">
            <style>
                @page Section1 {
                    size: 11.0in 8.5in;
                    margin: 0.4in 0.4in 0.4in 0.4in;
                    mso-page-orientation: landscape;
                }
                div.Section1 { page: Section1; }
                
                body, p, table, td, th, span { 
                    font-family: 'Arial', sans-serif; 
                    color: #0a2540; 
                    line-height: 1.2 !important;
                    margin-top: 0in !important;
                    margin-bottom: 0in !important;
                    mso-line-height-rule: exactly;
                }
                
                .title-doc { font-size: 18pt; font-weight: bold; color: #0a2540; margin-bottom: 2pt !important; }
                .subtitle-doc { font-size: 12pt; font-weight: bold; color: #20639b; margin-bottom: 10pt !important; }
                
                table { border-collapse: collapse; width: 100%; margin-bottom: 10pt; }
                th, td { border: 1pt solid #0a2540; padding: 5pt 4pt; font-size: 9pt; vertical-align: middle; text-align: center; }
                th { background-color: #f0f4f8; font-weight: bold; }
                .td-left { text-align: left; }
                .zone-row { background-color: #dfd5c2; font-weight: bold; text-align: left; font-size: 10pt; padding: 4pt 8pt; }
                .status-nok { color: #b30000; font-weight: bold; background-color: #fde8e8; }
                .status-ok { color: #28a745; font-weight: bold; }
                .photo-img { width: 120px; height: auto; max-height: 90px; }
            </style>
            </head>
            <body>
            <div class="Section1">
                <table style="border:none; margin-bottom:15pt; width:100%;">
                    <tr>
                        <td style="border:none; text-align:left; width:25%; vertical-align:middle;">
                            <img src="cid:logo_img" width="135" alt="Logo">
                        </td>
                        <td style="border:none; text-align:center; width:50%; vertical-align:middle;">
                            <div class="title-doc">RAPPORT DE MAINTENANCE PREVENTIVE</div>
                            <div class="subtitle-doc">${dynamicSubtitle}</div>
                        </td>
                        <td style="border:none; text-align:right; width:25%; font-size:9.5pt; color:#333; line-height:1.4 !important; vertical-align:middle;">
                            <strong>Date :</strong> ${dateV}<br>
                            <strong>Site :</strong> ${site}<br>
                            <strong>Technicien :</strong> ${tech}
                        </td>
                    </tr>
                </table>

                <table>
                    <thead>
                        <tr>
                            <th style="width:12%">Modèle</th>
                            <th style="width:11%">N° de Série</th>
                            <th style="width:7%">Machine ID</th>
                            <th style="width:9%">@ IP</th>
                            <th style="width:7%">Cellules</th>
                            <th style="width:7%">État Tête</th>
                            <th style="width:7%">Roller</th>
                            <th style="width:7%">Impression</th>
                            <th style="width:7%">État Gén.</th>
                            <th style="width:16%">Remarques / Actions</th>
                            <th style="width:10%">Photo</th>
                        </tr>
                    </thead>
                    <tbody>`;

            const zones = [...new Set(reportData.map(item => item.zone))];
            let imageAttachments = "";

            zones.forEach(z => {
                const zoneData = reportData.filter(item => item.zone === z);
                if (z !== "") {
                    wordHtml += `<tr><td colspan="11" class="zone-row">${z.toUpperCase()}</td></tr>`;
                }

                zoneData.forEach((d, index) => {
                    let cleanRemarque = formatRemarqueHTML(d.remarque) || "Aucune";
                    let photoHtml = "-";

                    if (d.photos && d.photos.length > 0) {
                        const photoCid = `photo_${z.replace(/[^a-zA-Z0-9]/g, '')}_${index}_${Date.now()}`;
                        photoHtml = `<img src="cid:${photoCid}" class="photo-img">`;
                        
                        const base64Data = d.photos[0].split(',')[1];
                        imageAttachments += `\n--${boundary}\nContent-Location: cid:${photoCid}\nContent-Transfer-Encoding: base64\n\n${base64Data}\n`;
                    }

                    wordHtml += `<tr>
                        <td class="td-left"><b>${d.modele}</b></td>
                        <td>${d.serial}</td>
                        <td>${d.lieuId || "-"}</td>
                        <td style="font-family:'Courier New'; font-size:8.5pt;">${d.ip || "-"}</td>
                        <td class="${d.cellules === 'NOK' ? 'status-nok' : ''}">${d.cellules || "-"}</td>
                        <td class="${d.etatDot !== 'OK' ? 'status-nok' : ''}">${d.etatDot || "-"}</td>
                        <td class="${d.roller !== 'OK' ? 'status-nok' : ''}">${d.roller || "-"}</td>
                        <td class="${d.impression === 'NOK' ? 'status-nok' : ''}">${d.impression || "-"}</td>
                        <td class="${d.general !== 'OK' ? 'status-nok' : ''}">${d.general || "-"}</td>
                        <td class="td-left" style="font-size:8.5pt;">${cleanRemarque}</td>
                        <td>${photoHtml}</td>
                    </tr>`;
                });
            });

            wordHtml += `</tbody></table></div></body></html>\n`;
            mhtml += wordHtml;

            mhtml += `\n--${boundary}\nContent-Location: cid:logo_img\nContent-Transfer-Encoding: base64\n\n${logoBase64}\n`;
            
            if(imageAttachments !== "") {
                mhtml += imageAttachments;
            }
            
            mhtml += `\n--${boundary}--\n`;

            const blob = new Blob([mhtml], { type: 'application/msword;charset=utf-8' });
            const link = document.createElement('a');
            const safeSite = site.replace(/[^a-zA-Z0-9_-]/g, '_') || "Rapport";
            link.href = URL.createObjectURL(blob);
            
            const today = new Date().toISOString().split('T')[0];
            link.download = `Rapport_Maintenance_${safeSite}_${today}.doc`;
            
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        });
    </script>
</body>
</html>
