<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rapport de Maintenance Préventive</title>
    
    <!-- Récupération de la mise en forme Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen p-4 md:p-8">

    <div class="max-w-7xl mx-auto">
        
        <!-- --- EN-TÊTE DU RAPPORT --- -->
        <header class="bg-slate-900 text-white p-6 rounded-xl shadow-md mb-6 border border-slate-800">
            <h1 class="text-xl md:text-2xl font-bold text-amber-400 tracking-wide uppercase mb-4">Visite de Maintenance Préventive</h1>
            
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase mb-1">Site</label>
                    <input type="text" id="headerSite" class="w-full bg-slate-800 border border-slate-700 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-400" placeholder="Saisir le site...">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase mb-1">Zone</label>
                    <input type="text" id="headerZone" class="w-full bg-slate-800 border border-slate-700 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-400" placeholder="Saisir la zone...">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase mb-1">Intervenant(s)</label>
                    <input type="text" id="headerIntervenant" class="w-full bg-slate-800 border border-slate-700 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-400" placeholder="Nom des intervenants...">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase mb-1">Date de visite</label>
                    <input type="date" id="headerDate" class="w-full bg-slate-800 border border-slate-700 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-400">
                </div>
            </div>
        </header>

        <!-- --- ZONE VIDÉO DU SCANNER (INTEGRATION FLUIDE) --- -->
        <div id="scanner-zone" class="hidden max-w-md mx-auto bg-black rounded-xl overflow-hidden relative border-4 border-amber-400 shadow-2xl mb-6">
            <video id="video" autoplay playsinline class="w-full h-auto block"></video>
            <!-- Ligne de visée rouge dynamique -->
            <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
                <div class="w-[85%] h-[20%] border-2 border-dashed border-amber-400 rounded flex items-center justify-center">
                    <div class="w-full h-0.5 bg-red-500 animate-pulse"></div>
                </div>
            </div>
            <button type="button" onclick="stopScanner()" class="w-full bg-red-600 hover:bg-red-700 text-white text-center font-bold py-3 text-sm tracking-wide uppercase transition">
                Fermer le scanner X
            </button>
        </div>

        <!-- --- FORMULAIRE DE SAISIE --- -->
        <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 mb-6">
            <h3 class="text-base font-bold text-slate-900 uppercase border-b pb-2 mb-4 tracking-tight">Saisie Machine</h3>
            
            <form id="maintenanceForm" onsubmit="return false;" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                
                <div class="flex flex-col">
                    <label for="printerType" class="text-xs font-bold text-slate-700 uppercase mb-1">Machine Type & ID</label>
                    <div class="flex gap-2">
                        <input type="text" id="printerType" class="flex-1 bg-slate-50 border border-slate-300 rounded px-3 py-2 text-sm focus:outline-none focus:border-slate-900" placeholder="Saisir ou flasher...">
                        <button type="button" onclick="startScanner('printerType')" class="bg-slate-900 hover:bg-slate-800 text-amber-400 font-bold px-4 rounded text-sm transition flex items-center gap-1 shadow">
                            📷 Scan
                        </button>
                    </div>
                </div>

                <div class="flex flex-col">
                    <label for="option" class="text-xs font-bold text-slate-700 uppercase mb-1">Option</label>
                    <input type="text" id="option" class="w-full bg-slate-100 border border-slate-300 rounded px-3 py-2 text-sm font-medium text-slate-600 focus:outline-none" placeholder="Option machine...">
                </div>

                <div class="flex flex-col">
                    <label for="serial" class="text-xs font-bold text-slate-700 uppercase mb-1">S/N (Numéro de série)</label>
                    <div class="flex gap-2">
                        <input type="text" id="serial" class="flex-1 bg-slate-50 border border-slate-300 rounded px-3 py-2 text-sm font-mono font-bold text-slate-900 focus:outline-none focus:border-slate-900" placeholder="Saisir ou flasher...">
                        <button type="button" onclick="startScanner('serial')" class="bg-slate-900 hover:bg-slate-800 text-amber-400 font-bold px-4 rounded text-sm transition flex items-center gap-1 shadow">
                            📷 Scan
                        </button>
                    </div>
                </div>

                <!-- GRILLE DES VÉRIFICATIONS TECHNIQUES -->
                <div class="md:col-span-3 bg-slate-50 p-4 rounded-xl border border-slate-200 mt-2">
                    <label class="block text-xs font-extrabold text-slate-900 uppercase tracking-wider mb-3">Points de contrôle & Vérifications</label>
                    
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                        <div class="bg-white p-3 rounded-lg border border-slate-200 shadow-sm">
                            <label class="block text-xs font-bold text-slate-600 mb-1">Cellules</label>
                            <select id="cellules" class="w-full bg-slate-50 border border-slate-300 rounded p-1.5 text-sm focus:outline-none">
                                <option value=""></option>
                                <option value="OK">OK</option>
                                <option value="NOK">NOK</option>
                            </select>
                        </div>
                        
                        <div class="bg-white p-3 rounded-lg border border-slate-200 shadow-sm">
                            <label class="block text-xs font-bold text-slate-600 mb-1">État dot</label>
                            <select id="etatDot" class="w-full bg-slate-50 border border-slate-300 rounded p-1.5 text-sm focus:outline-none">
                                <option value=""></option>
                                <option value="OK">OK</option>
                                <option value="Dots HS">Dots HS</option>
                                <option value="Surchauffe">Surchauffe</option>
                                <option value="Dots Usées">Dots Usées</option>
                            </select>
                        </div>
                        
                        <div class="bg-white p-3 rounded-lg border border-slate-200 shadow-sm">
                            <label class="block text-xs font-bold text-slate-600 mb-1">Platen roller</label>
                            <select id="roller" class="w-full bg-slate-50 border border-slate-300 rounded p-1.5 text-sm focus:outline-none">
                                <option value=""></option>
                                <option value="OK">OK</option>
                                <option value="Manque matière">Manque matière</option>
                                <option value="Cutter">Cutter</option>
                            </select>
                        </div>
                        
                        <div class="bg-white p-3 rounded-lg border border-slate-200 shadow-sm">
                            <label class="block text-xs font-bold text-slate-600 mb-1">Impression</label>
                            <select id="impression" class="w-full bg-slate-50 border border-slate-300 rounded p-1.5 text-sm focus:outline-none">
                                <option value=""></option>
                                <option value="OK">OK</option>
                                <option value="NOK">NOK</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="md:col-span-1 flex flex-col">
                    <label for="etatGeneral" class="text-xs font-bold text-slate-700 uppercase mb-1">État Général</label>
                    <select id="etatGeneral" class="w-full bg-slate-50 border border-slate-300 rounded px-3 py-2 text-sm focus:outline-none">
                        <option value=""></option>
                        <option value="OK">OK</option>
                        <option value="VOIR REM">VOIR REM</option>
                    </select>
                </div>

                <div class="md:col-span-2 flex flex-col">
                    <label for="remarque" class="text-xs font-bold text-slate-700 uppercase mb-1">Remarque / Action menée</label>
                    <textarea id="remarque" rows="1" class="w-full bg-slate-50 border border-slate-300 rounded px-3 py-2 text-sm focus:outline-none" placeholder="Saisir vos observations éventuelles..."></textarea>
                </div>

                <div class="md:col-span-3 bg-blue-50 p-4 rounded-xl border border-blue-100 flex flex-col sm:flex-row items-center justify-between gap-4 mt-2">
                    <div class="flex flex-col">
                        <span class="text-sm font-bold text-slate-900">Photos de panne ou illustration</span>
                        <span class="text-xs text-slate-500">Prise de vue grand angle via l'appareil photo natif</span>
                    </div>
                    <input type="file" id="photo" accept="image/*" capture="environment" multiple class="text-xs text-slate-600 bg-white border rounded p-2 shadow-sm file:mr-4 file:py-1 file:px-3 file:rounded file:border-0 file:text-xs file:font-bold file:bg-slate-900 file:text-amber-400 cursor-pointer">
                    <div class="photo-container flex gap-2 flex-wrap" id="previewContainer"></div>
                </div>

                <div class="md:col-span-3 flex justify-end mt-2">
                    <button type="button" id="addBtn" class="bg-amber-500 hover:bg-amber-600 text-slate-900 font-extrabold text-sm px-8 py-3 rounded-lg shadow-md transition uppercase tracking-wider">
                        Ajouter la ligne au tableau
                    </button>
                </div>
            </form>
        </div>

        <!-- --- BLOC TABLEAU DE SYNTHÈSE --- -->
        <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
            <div class="flex items-center justify-between border-b pb-3 mb-4">
                <h3 class="text-base font-bold text-slate-900 uppercase tracking-tight">Lignes enregistrées (<span id="count" class="text-amber-600">0</span>)</h3>
            </div>
            
            <div class="overflow-x-auto rounded-lg border border-slate-200">
                <table id="summaryTable" class="min-w-full divide-y divide-slate-200 text-xs text-center">
                    <thead class="bg-slate-900 text-white font-bold uppercase tracking-wider text-[10px]">
                        <tr>
                            <th class="px-3 py-3 text-left">Machine Type & ID</th>
                            <th class="px-3 py-3">Option</th>
                            <th class="px-3 py-3">S/N</th>
                            <th class="px-3 py-3">Cellules</th>
                            <th class="px-3 py-3">Etat dot</th>
                            <th class="px-3 py-3">Platen roller</th>
                            <th class="px-3 py-3">Impression</th>
                            <th class="px-3 py-3">Etat Général</th>
                            <th class="px-3 py-3 text-left">Remarque</th>
                            <th class="px-3 py-3">Photos</th>
                        </tr>
                    </thead>
                    <tbody class="bg-white divide-y divide-slate-200 text-slate-700 font-medium">
                        <!-- Rempli dynamiquement -->
                    </tbody>
                </table>
            </div>
            
            <!-- EXPORT EN MODE PAYSAGE -->
            <button type="button" id="exportBtn" class="bg-blue-700 hover:bg-blue-800 text-white font-bold text-sm px-6 py-3 rounded-lg shadow mt-4 flex items-center justify-center gap-2 transition w-full md:w-auto uppercase tracking-wide">
                📄 Exporter le rapport en Word (.doc) - Paysage
            </button>
        </div>
    </div>

    <!-- --- CODE SCRIPT INTEGRAL (SANS CASSER LES OUTILS) --- -->
    <script>
        const reportData = [];
        const previewContainer = document.getElementById('previewContainer');
        let currentPhotos = [];
        
        let videoStream = null;
        let scanInterval = null;
        let activeTargetId = null;

        document.addEventListener('DOMContentLoaded', () => {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('headerDate').value = today;
        });

        // Gestionnaire de Caméra Ultra-rapide natif Chrome
        async function startScanner(targetId) {
            activeTargetId = targetId;
            const video = document.getElementById('video');
            const scannerZone = document.getElementById('scanner-zone');

            try {
                videoStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } }
                });
                video.srcObject = videoStream;
                scannerZone.style.display = 'block';
                scannerZone.scrollIntoView({ behavior: 'smooth' });

                if ('BarcodeDetector' in window) {
                    const detector = new BarcodeDetector();
                    
                    scanInterval = setInterval(async () => {
                        try {
                            const barcodes = await detector.detect(video);
                            if (barcodes.length > 0) {
                                document.getElementById(activeTargetId).value = barcodes[0].rawValue;
                                if (navigator.vibrate) navigator.vibrate(80); 
                                stopScanner();
                            }
                        } catch (err) {
                            console.error(err);
                        }
                    }, 150);
                } else {
                    alert("Votre navigateur nécessite l'activation ou la mise à jour de l'API BarcodeDetector.");
                }

            } catch (err) {
                alert("Erreur d'accès caméra : " + err.message);
            }
        }

        function stopScanner() {
            if (scanInterval) clearInterval(scanInterval);
            if (videoStream) {
                videoStream.getTracks().forEach(track => track.stop());
            }
            document.getElementById('scanner-zone').style.display = 'none';
        }

        // Prévisualisation des photos d'anomalies
        document.getElementById('photo').addEventListener('change', function(e) {
            previewContainer.innerHTML = '';
            currentPhotos = [];
            const files = e.target.files;
            for(let file of files) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const img = document.createElement('img');
                    img.src = event.target.result;
                    img.className = "w-12 h-12 object-cover rounded-lg border-2 border-amber-400 shadow-sm";
                    previewContainer.appendChild(img);
                    currentPhotos.push(event.target.result);
                }
                reader.readAsDataURL(file);
            }
        });

        // Insertion propre d'une ligne dans le tableau structuré
        document.getElementById('addBtn').addEventListener('click', function(e) {
            e.preventDefault();
            const entry = {
                type: document.getElementById('printerType').value,
                option: document.getElementById('option').value,
                serial: document.getElementById('serial').value,
                cellules: document.getElementById('cellules').value,
                etatDot: document.getElementById('etatDot').value,
                roller: document.getElementById('roller').value,
                impression: document.getElementById('impression').value,
                general: document.getElementById('etatGeneral').value,
                remarque: document.getElementById('remarque').value,
                photos: [...currentPhotos]
            };
            reportData.push(entry);
            
            const tbody = document.querySelector('#summaryTable tbody');
            tbody.innerHTML = '';
            document.getElementById('count').innerText = reportData.length;
            
            reportData.forEach(data => {
                const photoIcon = (data.photos && data.photos.length > 0) ? `<span class="bg-blue-100 text-blue-800 font-bold px-2 py-0.5 rounded">${data.photos.length} 📸</span>` : 'Non';
                tbody.innerHTML += `<tr class="hover:bg-slate-50">
                    <td class="px-3 py-3 text-left font-bold text-slate-900">${data.type}</td>
                    <td class="px-3 py-3">${data.option || '-'}</td>
                    <td class="px-3 py-3 font-mono font-bold tracking-wider">${data.serial}</td>
                    <td class="px-3 py-3">${data.cellules || '-'}</td>
                    <td class="px-3 py-3">${data.etatDot || '-'}</td>
                    <td class="px-3 py-3">${data.roller || '-'}</td>
                    <td class="px-3 py-3">${data.impression || '-'}</td>
                    <td class="px-3 py-3">${data.general || '-'}</td>
                    <td class="px-3 py-3 text-left max-w-xs truncate">${data.remarque || '-'}</td>
                    <td class="px-3 py-3">${photoIcon}</td>
                </tr>`;
            });
            
            // Remise à zéro
            document.getElementById('maintenanceForm').reset();
            document.getElementById('headerDate').value = new Date().toISOString().split('T')[0];
            previewContainer.innerHTML = '';
            currentPhotos = [];
        });

        // Export de fichier Word (.doc) configuré à l'horizontale (Landscape)
        document.getElementById('exportBtn').addEventListener('click', function(e) {
            e.preventDefault();
            if(reportData.length === 0) return alert('Aucune donnée à exporter');
            
            const site = document.getElementById('headerSite').value || 'N/A';
            const zone = document.getElementById('headerZone').value || 'N/A';
            const intervenant = document.getElementById('headerIntervenant').value || 'N/A';
            const dateVisite = document.getElementById('headerDate').value || 'N/A';

            // Code mso structurel pour injecter les styles de mise en page paysage à Word
            let wordHtml = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">
            <head>
            <meta charset="utf-8">
            <style>
                @page SectionHorizontale {
                    size: 11in 8.5in;
                    margin: 0.5in 0.5in 0.5in 0.5in;
                    mso-page-orientation: landscape;
                }
                div.SectionHorizontale {
                    page: SectionHorizontale;
                }
                body { font-family: Arial, sans-serif; font-size: 11pt; } 
                h1 { color: #0f172a; border-bottom: 2px solid #c5a059; padding-bottom: 5px; font-size: 18pt; text-transform: uppercase; } 
                .meta-p { font-size: 11pt; margin-bottom: 20px; background: #f8fafc; padding: 10px; border: 1px solid #e2e8f0; }
                .main-table { width: 100%; border-collapse: collapse; margin-top: 10px; } 
                .main-table th { background: #0f172a; color: #ffffff; border: 1px solid #cbd5e1; padding: 8px; font-size: 9pt; text-transform: uppercase; } 
                .main-table td { border: 1px solid #cbd5e1; padding: 8px; font-size: 9.5pt; text-align: center; } 
                .text-left { text-align: left !important; }
                .word-img { max-width: 250px; height: auto; margin: 8px; border: 1px solid #cbd5e1; }
                .photo-title { font-size: 14pt; color: #0f172a; margin-top: 30px; border-bottom: 1px solid #e2e8f0; }
            </style>
            </head>
            <body>
            <div class="SectionHorizontale">
                <h1>Rapport Visite de Maintenance Préventive</h1>
                <p class="meta-p"><b>Site :</b> ${site} | <b>Zone :</b> ${zone} | <b>Intervenant :</b> ${intervenant} | <b>Date de visite :</b> ${dateVisite}</p>
                
                <table class="main-table">
                    <thead>
                        <tr>
                            <th>Machine Type & ID</th>
                            <th>Option</th>
                            <th>S/N</th>
                            <th>Cellules</th>
                            <th>Etat dot</th>
                            <th>Platen roller</th>
                            <th>Impression</th>
                            <th>Etat Général</th>
                            <th>Remarque</th>
                        </tr>
                    </thead>
                    <tbody>`;
            
            let photosHtml = "<h2 class='photo-title'>Photos Jointes (Annexes)</h2>";
            let hasPhotos = false;

            reportData.forEach(r => {
                wordHtml += `<tr>
                    <td class="text-left"><b>${r.type}</b></td>
                    <td>${r.option || '-'}</td>
                    <td><b>${r.serial}</b></td>
                    <td>${r.cellules || '-'}</td>
                    <td>${r.etatDot || '-'}</td>
                    <td>${r.roller || '-'}</td>
                    <td>${r.impression || '-'}</td>
                    <td>${r.general || '-'}</td>
                    <td class="text-left">${r.remarque || '-'}</td>
                </tr>`;
                
                if(r.photos && r.photos.length > 0) {
                    hasPhotos = true;
                    photosHtml += `<p style="margin-top:15px;"><b>Photos associées au S/N : ${r.serial} (${r.type})</b></p>`;
                    r.photos.forEach(img => { photosHtml += `<img class="word-img" src="${img}" />`; });
                }
            });
            
            wordHtml += "</tbody></table>";
            if(hasPhotos) wordHtml += "<br>" + photosHtml;
            wordHtml += "</div></body></html>";

            const blob = new Blob(['\ufeff' + wordHtml], { type: 'application/msword' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.setAttribute("download", `Rapport_Maintenance_${site.replace(/\s+/g, '_')}.doc`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        });
    </script>
</body>
</html>
