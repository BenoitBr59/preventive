<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAPPORT DE MAINTENANCE PREVENTIVE</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>

    <style>
        .zone-header { background-color: #e6f0fa; font-weight: bold; color: #0a2540; }
        .cropper-container { max-height: 400px; width: 100%; }
        #image-to-crop { max-width: 100%; display: block; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen p-4 md:p-8">

    <div class="max-w-7xl mx-auto bg-white rounded-xl shadow-md p-6">
        
        <div class="flex items-center justify-between border-b pb-3 mb-4">
            <h1 class="text-2xl font-bold text-blue-950 tracking-wide">RAPPORT DE MAINTENANCE PREVENTIVE</h1>
        </div>
        
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6 p-4 bg-gray-50 rounded-lg border border-gray-200">
            <div>
                <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Client / Site</label>
                <input type="text" id="headerSite" class="w-full bg-white border border-gray-300 rounded px-3 py-2 text-sm focus:outline-blue-500" placeholder="Ex: Site Paris">
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Intervenant / Technicien</label>
                <select id="headerIntervenant" class="w-full bg-white border border-gray-300 rounded px-3 py-2 text-sm focus:outline-blue-500">
                    <option value="">-- Choisir l'intervenant --</option>
                    <option value="Pascal CARTON">Pascal CARTON</option>
                    <option value="Benoît BRACKMAN">Benoît BRACKMAN</option>
                    <option value="Pascal CARTON / Benoît BRACKMAN">Pascal CARTON / Benoît BRACKMAN</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Parc d'imprimante</label>
                <select id="headerBrand" class="w-full bg-white border border-gray-300 rounded px-3 py-2 text-sm focus:outline-blue-500">
                    <option value="ZEBRA">ZEBRA</option>
                    <option value="HONEYWELL">HONEYWELL</option>
                    <option value="TOSHIBA">TOSHIBA</option>
                    <option value="INTERMEC">INTERMEC</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Date d'intervention</label>
                <input type="date" id="headerDate" class="w-full bg-white border border-gray-300 rounded px-3 py-2 text-sm focus:outline-blue-500">
            </div>
        </div>

        <form id="machineForm" class="bg-gray-50 p-4 rounded-lg border border-gray-200 mb-6 grid grid-cols-1 md:grid-cols-4 gap-4">
            <div class="md:col-span-4">
                <h3 class="text-sm font-bold text-blue-950 uppercase border-b pb-1 mb-2">Ajouter un équipement au rapport</h3>
            </div>
            
            <div>
                <label class="block text-xs font-medium text-gray-700 mb-1">Zone / Emplacement</label>
                <input type="text" id="zone" class="w-full bg-white border border-gray-300 rounded px-3 py-1.5 text-sm" placeholder="Ex: Expédition">
            </div>
            
            <div>
                <label class="block text-xs font-medium text-gray-700 mb-1">Modèle d'imprimante (P/N)</label>
                <input type="text" id="modele" class="w-full bg-white border border-gray-300 rounded px-3 py-1.5 text-sm bg-yellow-50 font-semibold" placeholder="Détecté automatiquement" required>
            </div>
            
            <div>
                <label class="block text-xs font-medium text-gray-700 mb-1">Machine ID / Lieu précis</label>
                <input type="text" id="lieuId" class="w-full bg-white border border-gray-300 rounded px-3 py-1.5 text-sm" placeholder="ID Interne / Emplacement">
            </div>
            
            <div>
                <label class="block text-xs font-medium text-gray-700 mb-1">Numéro de Série (S/N)</label>
                <div class="flex flex-col gap-1">
                    <div class="flex">
                        <input type="text" id="serial" class="w-full bg-white border border-gray-300 rounded-l px-3 py-1.5 text-sm focus:outline-blue-500 font-bold" placeholder="S/N" required>
                        <button type="button" onclick="triggerPhotoScanner()" class="bg-blue-600 hover:bg-blue-700 text-white rounded-r px-4 text-xs font-bold cursor-pointer flex items-center gap-1 shadow whitespace-nowrap">
                            📷 SCANNER CODE-BARRES
                        </button>
                    </div>
                    <div id="scanFeedbackMessage" class="hidden text-xs font-medium p-1 mt-0.5 rounded"></div>
                </div>
                <input type="file" id="scannerCameraInput" accept="image/*" capture="environment" class="hidden">
            </div>

            <div class="md:col-span-2 grid grid-cols-2 gap-4 bg-white p-3 rounded border border-gray-200">
                <div>
                    <label class="block text-xs font-medium text-gray-700 mb-1">Cellules / Capteurs</label>
                    <select id="cellules" class="w-full bg-gray-50 border border-gray-300 rounded px-2 py-1 text-sm">
                        <option value="OK">OK</option>
                        <option value="NOK">NOK</option>
                        <option value="-">-</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-700 mb-1">État Dot (Tête)</label>
                    <select id="etatDot" class="w-full bg-gray-50 border border-gray-300 rounded px-2 py-1 text-sm">
                        <option value="OK">OK</option>
                        <option value="1 Dot HS">1 Dot HS</option>
                        <option value="2 Dots HS">2 Dots HS</option>
                        <option value="Plusieurs Dots HS">Plusieurs Dots HS</option>
                        <option value="Tête HS">Tête HS</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-700 mb-1">Pressing Roller</label>
                    <select id="roller" class="w-full bg-gray-50 border border-gray-300 rounded px-2 py-1 text-sm">
                        <option value="OK">OK</option>
                        <option value="Marqué">Marqué</option>
                        <option value="À remplacer">À remplacer</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-700 mb-1">Test Impression</label>
                    <select id="impression" class="w-full bg-gray-50 border border-gray-300 rounded px-2 py-1 text-sm">
                        <option value="OK">OK</option>
                        <option value="NOK">NOK</option>
                    </select>
                </div>
            </div>

            <div class="md:col-span-2 grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-medium text-gray-700 mb-1">Adresse IP</label>
                    <input type="text" id="ip" class="w-full bg-white border border-gray-300 rounded px-3 py-1.5 text-sm" placeholder="192.168.x.x">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-700 mb-1">État Général</label>
                    <select id="general" class="w-full bg-white border border-gray-300 rounded px-3 py-1.5 text-sm">
                        <option value="OK">OK</option>
                        <option value="A surveiller">A surveiller</option>
                        <option value="Critique">Critique</option>
                    </select>
                </div>
                <div class="col-span-2">
                    <label class="block text-xs font-medium text-gray-700 mb-1">Remarques / Actions menées</label>
                    <textarea id="remarque" rows="2" class="w-full bg-white border border-gray-300 rounded px-3 py-1 text-sm" placeholder="Nettoyage, changement de pièce..."></textarea>
                </div>
            </div>

            <div class="md:col-span-4 bg-blue-50 p-4 rounded border border-blue-200 flex flex-col sm:flex-row items-center justify-between gap-4">
                <span class="text-sm font-bold text-blue-900">Pièce-jointe (Photo d'illustration)</span>
                <button type="button" id="capturePhotoBtn" class="bg-blue-700 hover:bg-blue-800 text-white font-bold text-xs px-5 py-3 rounded-lg shadow">
                    📷 Déclencher l'appareil photo
                </button>
                <input type="file" id="cameraInput" accept="image/*" capture="environment" class="hidden">
                <div id="photoPreviewContainer" class="hidden border-l pl-4 border-blue-200">
                    <img id="photoPreview" src="" class="h-12 w-auto rounded border bg-white" style="aspect-ratio: 10 / 4; object-fit: cover;">
                </div>
            </div>

            <div class="md:col-span-4 flex justify-end mt-2">
                <button type="submit" class="bg-blue-950 hover:bg-blue-900 text-white font-bold text-sm px-6 py-2 rounded shadow">
                    Ajouter au tableau
                </button>
            </div>
        </form>

        <div class="overflow-x-auto border border-gray-200 rounded-lg">
            <table class="min-w-full divide-y divide-gray-200 text-sm text-center">
                <thead class="bg-blue-950 text-white text-xs uppercase font-bold">
                    <tr>
                        <th class="px-3 py-3 text-left">Imprimante / Lieu ID</th>
                        <th class="px-3 py-3">Numéro de Série (S/N)</th>
                        <th class="px-3 py-3">Actions</th>
                    </tr>
                </thead>
                <tbody id="reportTableBody" class="bg-white divide-y divide-gray-200">
                    <tr><td colspan="3" class="px-6 py-4 text-gray-500 text-center italic">Aucune machine dans le rapport.</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <div id="staticScannerTmp" class="hidden"></div>

    <div id="cropperModal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-lg p-4 max-w-lg w-full flex flex-col max-h-[90vh]">
            <div class="overflow-hidden flex-1 bg-gray-100 flex items-center justify-center rounded">
                <img id="imageToCrop" src="">
            </div>
            <div class="flex justify-end gap-2 mt-4">
                <button type="button" id="cancelCropBtn" class="bg-gray-300 text-xs px-4 py-2 rounded">Annuler</button>
                <button type="button" id="saveCropBtn" class="bg-blue-600 text-white font-bold text-xs px-4 py-2 rounded">Valider</button>
            </div>
        </div>
    </div>

    <script>
        let reportData = [];
        let currentPhotoBase64 = null;
        let cropperInstance = null;

        document.getElementById('headerDate').value = new Date().toISOString().split('T')[0];

        function devinerNomModele(texte) {
            let t = texte.toUpperCase();
            if (t.includes("ZT421") || t.includes("42J")) return "ZEBRA ZT421 (203 dpi)";
            if (t.includes("ZT411") || t.includes("41J")) return "ZEBRA ZT411 (203 dpi)";
            if (t.includes("ZD421") || t.includes("33J")) return "ZEBRA ZD421";
            if (t.includes("ZM400") || t.includes("12C")) return "ZEBRA ZM400";
            if (t.includes("ZT410") || t.includes("41A")) return "ZEBRA ZT410";
            if (t.includes("ZT420") || t.includes("42A")) return "ZEBRA ZT420";
            return "";
        }

        /* ==========================================================
           LOGIQUE DE NUMÉRISATION AVEC RE-SAMPLE CANVAs (MÉMOIRE)
           ========================================================== */
        window.triggerPhotoScanner = function() {
            document.getElementById('scannerCameraInput').click();
        };

        document.getElementById('scannerCameraInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const feedback = document.getElementById('scanFeedbackMessage');
            feedback.classList.remove('hidden');
            feedback.innerText = "⏳ Optimisation de l'image & Décodage...";
            feedback.className = "text-xs font-bold p-1 bg-blue-50 text-blue-700 mt-0.5 rounded animate-pulse";

            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.src = event.target.result;
                
                img.onload = async function() {
                    // 🎛️ CRÉATION DE LA MOULINETTE PIXELS (Canvas de réduction)
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    
                    // On force une largeur de 1200px (Excellent compromis de netteté pour le Code 128)
                    const targetWidth = 1200;
                    const scaleFactor = targetWidth / img.width;
                    canvas.width = targetWidth;
                    canvas.height = img.height * scaleFactor;
                    
                    // Dessin de l'image compressée
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    
                    // Conversion de la zone nettoyée en blob pour le moteur d'analyse
                    canvas.toBlob(async function(blob) {
                        const optimizedFile = new File([blob], "compressed_scan.jpg", { type: "image/jpeg" });
                        let codeDetecte = null;

                        // Tentative 1 : Utilisation des Play Services du navigateur (si dispo)
                        if ('BarcodeDetector' in window) {
                            try {
                                const detector = new BarcodeDetector({ formats: ['code_128'] });
                                const barcodes = await detector.detect(canvas);
                                if (barcodes && barcodes.length > 0) {
                                    codeDetecte = barcodes[0].rawValue;
                                }
                            } catch (err) { console.log("Moteur natif indisponible."); }
                        }

                        // Tentative 2 : Moteur de secours robuste
                        if (!codeDetecte) {
                            try {
                                const html5QrCodeStatic = new Html5Qrcode("staticScannerTmp");
                                codeDetecte = await html5QrCodeStatic.scanFile(optimizedFile, false);
                            } catch (err) { console.log("Échec de la lecture de secours."); }
                        }

                        // Analyse du résultat final
                        if (codeDetecte) {
                            trierEtValiderCode128(codeDetecte);
                        } else {
                            feedback.innerText = "❌ Code-barres non détecté. Reculez un peu et assurez-vous que l'étiquette soit bien éclairée.";
                            feedback.className = "text-xs font-bold p-1 bg-red-50 text-red-600 mt-0.5 rounded";
                        }
                        
                        document.getElementById('scannerCameraInput').value = '';
                    }, 'image/jpeg', 0.90);
                };
            };
            reader.readAsDataURL(file);
        });

        function trierEtValiderCode128(decodedText) {
            let brute = decodedText.trim();
            let upper = brute.toUpperCase();
            
            let fieldSerial = document.getElementById('serial');
            let fieldModele = document.getElementById('modele');
            let feedback = document.getElementById('scanFeedbackMessage');

            // 🛑 FILTRE ANTI-DATAMATRIX INDUSTRIAL
            if (brute.startsWith("[)>") || brute.startsWith(">") || brute.length > 35) {
                feedback.innerText = "🛑 Datamatrix ignoré. Ciblez bien le code à barres classique en lignes.";
                feedback.className = "text-xs font-bold p-1 bg-yellow-100 text-yellow-800 mt-0.5 rounded";
                return;
            }

            let troisDigits = upper.substring(0, 3);

            // Détection Modèle (P/N)
            if (troisDigits === "ZT4" || troisDigits === "ZD4" || troisDigits === "42J" || troisDigits === "41J" || troisDigits === "1P" || brute.includes("-")) {
                let propre = troisDigits === "1P" ? brute.substring(2) : brute;
                fieldModele.value = devinerNomModele(propre) || propre;
                feedback.innerText = "✔️ Code Modèle enregistré ! Prenez maintenant le Numéro de Série (S/N).";
                feedback.className = "text-xs font-bold p-1 bg-blue-100 text-blue-800 mt-0.5 rounded";
            } 
            // Détection Numéro de Série (S/N)
            else {
                if (brute.length < 5) return;
                let propre = (upper.startsWith('S') && !isNaN(upper.charAt(1))) ? brute.substring(1) : brute;
                fieldSerial.value = propre;
                
                if (!fieldModele.value) {
                    fieldModele.value = devinerNomModele(propre);
                }
                feedback.innerText = "✨ Numéro de Série (S/N) injecté !";
                feedback.className = "text-xs font-bold p-1 bg-green-100 text-green-800 mt-0.5 rounded";
            }
        }

        /* ==========================================================
           LOGIQUE TECHNIQUE INTERNE (COMPAGNON PHOTOS & TABLEAU)
           ========================================================== */
        const cameraInput = document.getElementById('cameraInput');
        const imageToCrop = document.getElementById('imageToCrop');
        document.getElementById('capturePhotoBtn').addEventListener('click', () => cameraInput.click());

        cameraInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    imageToCrop.src = event.target.result;
                    document.getElementById('cropperModal').classList.remove('hidden');
                    if (cropperInstance) cropperInstance.destroy();
                    cropperInstance = new Cropper(imageToCrop, { aspectRatio: 10 / 4, viewMode: 1 });
                };
                reader.readAsDataURL(file);
            }
        });

        document.getElementById('saveCropBtn').addEventListener('click', function() {
            if (cropperInstance) {
                const canvas = cropperInstance.getCroppedCanvas({ maxWidth: 800, maxHeight: 320 });
                currentPhotoBase64 = canvas.toDataURL('image/jpeg', 0.85);
                document.getElementById('photoPreview').src = currentPhotoBase64;
                document.getElementById('photoPreviewContainer').classList.remove('hidden');
                closeCropperModal();
            }
        });

        function closeCropperModal() {
            document.getElementById('cropperModal').classList.add('hidden');
            if (cropperInstance) { cropperInstance.destroy(); cropperInstance = null; }
            cameraInput.value = '';
        }
        document.getElementById('cancelCropBtn').addEventListener('click', closeCropperModal);

        document.getElementById('machineForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const item = {
                idKey: Date.now(),
                zone: document.getElementById('zone').value.trim(),
                modele: document.getElementById('modele').value.trim(),
                lieuId: document.getElementById('lieuId').value.trim(),
                serial: document.getElementById('serial').value.trim(),
                ip: document.getElementById('ip').value.trim(),
                cellules: document.getElementById('cellules').value,
                etatDot: document.getElementById('etatDot').value,
                roller: document.getElementById('roller').value,
                impression: document.getElementById('impression').value,
                general: document.getElementById('general').value,
                remarque: document.getElementById('remarque').value.trim(),
                photos: currentPhotoBase64 ? [currentPhotoBase64] : []
            };
            reportData.push(item);
            updateTable();
            document.getElementById('modele').value = '';
            document.getElementById('serial').value = '';
            document.getElementById('lieuId').value = '';
            document.getElementById('ip').value = '';
            document.getElementById('remarque').value = '';
            document.getElementById('photoPreviewContainer').classList.add('hidden');
            document.getElementById('scanFeedbackMessage').classList.add('hidden');
            currentPhotoBase64 = null;
        });

        function updateTable() {
            const tbody = document.getElementById('reportTableBody');
            tbody.innerHTML = '';
            if (reportData.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" class="px-6 py-4 text-gray-500 text-center italic">Aucune machine dans le rapport.</td></tr>`;
                return;
            }
            reportData.forEach(d => {
                const row = document.createElement('tr');
                row.className = "hover:bg-gray-50 text-xs text-gray-700";
                row.innerHTML = `
                    <td class="px-3 py-3 text-left">
                        <div class="font-bold text-gray-900">${d.modele}</div>
                        <div class="text-gray-500 italic text-[11px]">${d.lieuId || '-'}</div>
                    </td>
                    <td class="px-3 py-3 font-bold text-gray-800 text-sm tracking-wider">${d.serial}</td>
                    <td class="px-3 py-3">
                        <button onclick="deleteRow(${d.idKey})" class="text-red-600 font-bold cursor-pointer">Supprimer</button>
                    </td>
                `;
                tbody.appendChild(row);
            });
        }

        window.deleteRow = function(id) {
            reportData = reportData.filter(i => i.idKey !== id);
            updateTable();
        };
    </script>
</body>
</html>
