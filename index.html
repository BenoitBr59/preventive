<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rapport de Maintenance Préventive</title>

    <style>
        :root {
            --primary: #0a2540; 
            --accent: #d92727;  
            --yellow-logo: #f2a900; 
            --bg: #f4f7fa;      
            --card-bg: #ffffff;
            --secondary-blue: #20639b; 
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--primary);
            margin: 0;
            padding: 15px;
        }

        header {
            background: var(--primary);
            color: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            border-bottom: 4px solid var(--accent);
        }

        .header-top-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
            gap: 15px;
        }

        header h1 { 
            margin: 0; 
            font-size: 1.4rem; 
            color: #ffffff; 
            flex: 1;
        }

        .header-logo-container {
            background: #0a2540;
            padding: 4px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 110px;
            height: 65px;
            box-sizing: border-box;
            flex-shrink: 0;
        }

        .header-logo-container svg {
            width: 100%;
            height: 100%;
        }

        .header-inputs {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .header-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-group label {
            font-size: 0.95rem;
            min-width: 140px;
            font-weight: bold;
            margin: 0;
            color: #ffffff;
        }

        .header-group input, .header-group select {
            background: rgba(255, 255, 255, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.5);
            color: white;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.95rem;
            height: 38px;
            flex: 1;
            box-sizing: border-box;
        }

        .header-group input::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }

        .header-group select option {
            background-color: var(--primary);
            color: white;
        }

        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(10,37,64,0.08);
            margin-bottom: 20px;
        }

        h3 {
            color: var(--primary);
            margin-top: 0;
            border-bottom: 2px solid #e1e8ed;
            padding-bottom: 8px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 0.9rem;
            color: var(--primary);
        }

        .input-scan-group {
            display: flex;
            gap: 8px;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ced4da;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 1rem;
            background-color: #fff;
            height: 45px;
            color: var(--primary);
        }

        textarea { height: auto; }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--secondary-blue);
            box-shadow: 0 0 0 3px rgba(32,99,155,0.15);
        }

        .btn-scan {
            width: auto;
            padding: 0 15px;
            background: var(--primary);
            color: white;
            border: 1px solid var(--primary);
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
        }

        /* ZONE PHOTO & SCAN CAPTURE MANUELLE ET FLUX */
        #scanner-zone {
            display: none;
            margin: 15px 0;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            padding: 10px;
            text-align: center;
        }

        #native-video { 
            width: 100%; 
            max-height: 280px; 
            background: #000; 
            border-radius: 6px;
            display: block;
        }

        .scanner-controls {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .btn-action-scanner {
            flex: 1;
            padding: 12px;
            text-align: center;
            font-weight: bold;
            cursor: pointer;
            border-radius: 6px;
            color: white;
            font-size: 0.95rem;
        }

        .btn-capture { background: #28a745; border: none; }
        .btn-close { background: var(--accent); border: none; }

        /* ZONE DE ROGNAGE INTEGREE SANS COMPOSANTS EXTERNES PLANTEURS */
        #crop-zone {
            display: none;
            background: #111;
            padding: 15px;
            border-radius: 12px;
            margin: 15px 0;
            color: white;
            text-align: center;
        }
        
        .crop-box-viewport {
            position: relative;
            max-width: 100%;
            height: 260px;
            margin: 10px auto;
            background: #222;
            border-radius: 6px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #image-to-crop {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .crop-overlay-frame {
            position: absolute;
            border: 3px dashed var(--yellow-logo);
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.6);
            width: 85%;
            height: 40%;
            pointer-events: none;
            box-sizing: border-box;
        }

        .crop-buttons { display: flex; gap: 10px; margin-top: 15px; }
        .crop-buttons button {
            flex: 1;
            padding: 14px;
            font-size: 0.95rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .grid-status {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .status-box {
            background: #f8f9fa;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #e1e8ed;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-add { background: var(--secondary-blue); color: white; margin-top: 10px; }
        
        .btn-export { 
            background: var(--yellow-logo); 
            color: #000000; 
            margin-top: 20px; 
        }

        .photo-container {
            margin-top: 10px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .photo-preview {
            width: 100px;
            height: 40px;
            object-fit: fill;
            border-radius: 4px;
            border: 1px solid var(--secondary-blue);
        }

        .table-container {
            overflow-x: auto;
            margin-top: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.95rem;
            margin-bottom: 20px;
        }

        th, td {
            border: 1px solid #ced4da;
            padding: 10px;
            text-align: left;
        }

        th { background: #f8f9fa; font-weight: bold; color: var(--primary); }

        .zone-header-row {
            background-color: #e6f0fa !important;
            font-weight: bold;
            color: var(--primary);
            text-align: center;
            padding: 6px;
        }

        .green-arrow {
            color: #28a745;
            font-weight: bold;
            margin-right: 5px;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-top-row">
            <h1>Visite de Maintenance Préventive</h1>
            <div class="header-logo-container">
                <svg viewBox="0 0 130 75" xmlns="http://www.w3.org/2000/svg">
                    <rect width="130" height="75" fill="#0a2540" rx="8"/>
                    
                    <circle cx="34" cy="34" r="19" fill="#f2a900"/>
                    <path d="M15 34 H53 M34 15 V53" stroke="#0a2540" stroke-width="3"/>
                    <circle cx="34" cy="34" r="11" stroke="#0a2540" stroke-width="2" fill="none"/>
                    
                    <text x="60" y="30" font-family="'Arial Black', Gadget, sans-serif" font-size="16" font-weight="900" fill="#ffffff" letter-spacing="0.5">TRAC</text>
                    <text x="60" y="49" font-family="'Arial Black', Gadget, sans-serif" font-size="16" font-weight="900" fill="#d92727" letter-spacing="0.5">INFO</text>
                    
                    <path d="M12 62 L42 59 L65 64 L90 59 L118 62" stroke="#d92727" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
                </svg>
            </div>
        </div>
        
        <div class="header-inputs">
            <div class="header-group">
                <label for="headerSite">Client / Site :</label>
                <input type="text" id="headerSite" placeholder="Nom du client ou du site...">
            </div>
            <div class="header-group">
                <label for="headerBrand">Équipement du site :</label>
                <select id="headerBrand">
                    <option value="ZEBRA">Imprimantes ZEBRA</option>
                    <option value="INTERMEC">Imprimantes INTERMEC</option>
                    <option value="HONEYWELL">Imprimantes HONEYWELL</option>
                    <option value="ZEBRA & INTERMEC">Imprimantes ZEBRA & INTERMEC</option>
                </select>
            </div>
            <div class="header-group">
                <label for="headerIntervenant">Intervenant(s) :</label>
                <select id="headerIntervenant">
                    <option value="Pascal CARTON & Benoit BRACKMAN">Pascal CARTON & Benoit BRACKMAN</option>
                    <option value="Pascal CARTON">Pascal CARTON</option>
                    <option value="Benoit BRACKMAN">Benoit BRACKMAN</option>
                </select>
            </div>
            <div class="header-group">
                <label for="headerDate">Date de visite :</label>
                <input type="date" id="headerDate">
            </div>
        </div>
    </header>

    <div id="scanner-zone">
        <video id="native-video" autoplay playsinline></video>
        <input type="file" id="fallback-file-input" accept="image/*" capture="environment" style="display:none;">
        <div class="scanner-controls">
            <div class="btn-action-scanner btn-capture" onclick="captureNativeFrame()">⚡ LIRE CE VISUEL</div>
            <div class="btn-action-scanner btn-close" onclick="stopNativeScanner()">Fermer</div>
        </div>
    </div>

    <div id="crop-zone">
        <h4 style="margin-top:0;">Ajustement de l'image (Format Vignette)</h4>
        <div class="crop-box-viewport">
            <img id="image-to-crop" src="" alt="Cible">
            <div class="crop-overlay-frame"></div>
        </div>
        <div class="crop-buttons">
            <button type="button" style="background:#28a745; color:white;" onclick="processNativeCrop()">Valider le rognage</button>
            <button type="button" style="background:var(--accent); color:white;" onclick="cancelNativeCrop()">Annuler</button>
        </div>
    </div>

    <div class="card">
        <h3>Saisie Machine</h3>
        <form id="maintenanceForm" onsubmit="return false;">
            
            <div class="form-group">
                <label for="printerZone">Zone / Secteur (Facultatif)</label>
                <input type="text" id="printerZone" placeholder="Ex: LOGISTIQUE 1, SECTEUR BOL...">
            </div>

            <div class="form-group">
                <label for="printerType">Imprimante (Modèle & Type de tête)</label>
                <div class="input-scan-group">
                    <input type="text" id="printerType" placeholder="Ex: ZT420 8 DOTS, ZT231...">
                    <button type="button" class="btn-scan" onclick="launchSecureCapture('printerType')">📷 Scan</button>
                </div>
            </div>

            <div class="form-group">
                <label for="printerId">Machine ID (Lieu / Optionnel)</label>
                <input type="text" id="printerId" placeholder="Saisir l'ID ou le Lieu au clavier...">
            </div>

            <div class="form-group">
                <label for="serial">S/N (Numéro de série)</label>
                <div class="input-scan-group">
                    <input type="text" id="serial" placeholder="Flasher le S/N en ligne...">
                    <button type="button" class="btn-scan" onclick="launchSecureCapture('serial')">📷 Scan</button>
                </div>
            </div>

            <div class="form-group">
                <label for="ipAddress">@ IP</label>
                <input type="text" id="ipAddress" placeholder="Ex: 172.16.82.52">
            </div>

            <div class="form-group">
                <label>Vérifications terrain</label>
                <div class="grid-status">
                    <div class="status-box">
                        <label style="font-size:0.8rem;">Cellules</label>
                        <select id="cellules">
                            <option value="OK">OK</option>
                            <option value="NOK">NOK</option>
                            <option value="">Non renseigné</option>
                        </select>
                    </div>
                    <div class="status-box">
                        <label style="font-size:0.8rem;">Etat dot</label>
                        <select id="etatDot">
                            <option value="OK">OK</option>
                            <option value="Nombreuses dots HS">Nombreuses dots HS</option>
                            <option value="Défaut dots">Défaut dots / HS</option>
                            <option value="NOK">NOK</option>
                            <option value="">Non renseigné</option>
                        </select>
                    </div>
                    <div class="status-box">
                        <label style="font-size:0.8rem;">Pressing Roller</label>
                        <select id="roller">
                            <option value="OK">OK</option>
                            <option value="Cutter">Cutter (Coup de cutter)</option>
                            <option value="Coups de cutter">Coups de cutter</option>
                            <option value="NOK">NOK</option>
                            <option value="">Non renseigné</option>
                        </select>
                    </div>
                    <div class="status-box">
                        <label style="font-size:0.8rem;">Impression</label>
                        <select id="impression">
                            <option value="OK">OK</option>
                            <option value="NOK">NOK</option>
                            <option value="">Non renseigné</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label for="etatGeneral">Etat Général</label>
                <select id="etatGeneral">
                    <option value="OK">OK</option>
                    <option value="Voir Rem">Voir Rem</option>
                    <option value="Non vu">Non vu</option>
                </select>
            </div>

            <div class="form-group">
                <label for="remarque">Remarques / Actions à mener (Utilisez le tiret '-' pour aller à la ligne)</label>
                <textarea id="remarque" rows="3" placeholder="Saisir les remarques... Ex: - Nettoyage effectué - Tête à changer"></textarea>
            </div>

            <div class="form-group">
                <label for="photo">Photos des défauts / panne (Optionnel)</label>
                <input type="file" id="photo" accept="image/*" capture="environment" style="padding:5px; height:auto;">
                <div class="photo-container" id="previewContainer"></div>
            </div>

            <button type="button" class="btn-add" id="addBtn">Ajouter au tableau</button>
        </form>
    </div>

    <div class="card">
        <h3>Imprimantes enregistrées (<span id="count">0</span>)</h3>
        <div class="table-container">
            <table id="summaryTable">
                <thead>
                    <tr>
                        <th>Numéros de Série (S/N) enregistrés</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                </tbody>
            </table>
        </div>
        <button type="button" class="btn-export" id="exportBtn">Exporter le rapport officiel (.doc)</button>
    </div>

    <script>
        let reportData = [];
        const previewContainer = document.getElementById('previewContainer');
        let currentPhotos = [];
        let activeTargetId = null;
        let localVideoStream = null;

        // Base64 épurée et fiable du logo TRACINFO pour l'intégration automatique dans MS Word
        const WORD_LOGO_BASE64 = "iVBORw0KGgoAAAANSUhEUgAAAGQAAABGAwMAAAAUK57NAAAABlBMVEUAIwX///9eN7gFAAAAAXRSTlMAQObYZgAAADlJREFUOMtjYKA7YGBgYGBwYGBgYmBiYgIDRhwKGBgYmBiYwIDhBoYgZgMDwz8GBgYmBiYwYMRBAADZpAyme99VAAAAAElFTkSuQmCC";

        // --- SAUVEGARDE & PERSISTANCE ---
        function saveAppStateToLocalStorage() {
            localStorage.setItem('preventive_reportData', JSON.stringify(reportData));
            localStorage.setItem('preventive_site', document.getElementById('headerSite').value);
            localStorage.setItem('preventive_brand', document.getElementById('headerBrand').value);
            localStorage.setItem('preventive_intervenant', document.getElementById('headerIntervenant').value);
            localStorage.setItem('preventive_date', document.getElementById('headerDate').value);
        }

        function loadAppStateFromLocalStorage() {
            const savedData = localStorage.getItem('preventive_reportData');
            if (savedData) {
                reportData = JSON.parse(savedData);
                renderTable();
            }
            if (localStorage.getItem('preventive_site')) document.getElementById('headerSite').value = localStorage.getItem('preventive_site');
            if (localStorage.getItem('preventive_brand')) document.getElementById('headerBrand').value = localStorage.getItem('preventive_brand');
            if (localStorage.getItem('preventive_intervenant')) document.getElementById('headerIntervenant').value = localStorage.getItem('preventive_intervenant');
            if (localStorage.getItem('preventive_date')) {
                document.getElementById('headerDate').value = localStorage.getItem('preventive_date');
            } else {
                document.getElementById('headerDate').value = new Date().toISOString().split('T')[0];
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadAppStateFromLocalStorage();
            document.getElementById('headerSite').addEventListener('input', saveAppStateToLocalStorage);
            document.getElementById('headerBrand').addEventListener('change', saveAppStateToLocalStorage);
            document.getElementById('headerIntervenant').addEventListener('change', saveAppStateToLocalStorage);
            document.getElementById('headerDate').addEventListener('change', saveAppStateToLocalStorage);
            
            // Écouteur pour la méthode fichier si la vidéo en direct est bloquée par l'OS du smartphone
            document.getElementById('fallback-file-input').addEventListener('change', function(e) {
                if (e.target.files.length === 0) return;
                parseFileAndExtractText(e.target.files[0]);
            });
        });

        // --- DÉDUCTION DES MACHINES ---
        function getModelFromSerialNumber(sn) {
            const snUpper = sn.toUpperCase().trim();
            if (snUpper.startsWith("18J")) return "ZT420 8 DOTS";
            if (snUpper.startsWith("19J")) return "ZT420 12 DOTS";
            if (snUpper.startsWith("99J")) return "ZT421 8 DOTS";
            if (snUpper.startsWith("98J")) return "ZT421 12 DOTS";
            if (snUpper.startsWith("T3J")) return "ZT231 8 DOTS";
            if (snUpper.startsWith("52J")) return "ZT230 8 DOTS";
            if (snUpper.startsWith("51J")) return "ZT220 8 DOTS";
            if (snUpper.startsWith("10J")) return "ZT410 8 DOTS";
            if (snUpper.startsWith("11J")) return "ZT411 12 DOTS";
            if (snUpper.startsWith("41J")) return "ZT510 8 DOTS";
            if (snUpper.startsWith("48J")) return "ZT610 8 DOTS";
            if (snUpper.startsWith("ZM4")) return "ZM400 8 DOTS";
            if (snUpper.startsWith("ZM6")) return "ZM600 8 DOTS";
            return "";
        }

        function processScannedBarcode(rawValue) {
            let cleanStr = rawValue.trim();
            cleanStr = cleanStr.replace(/^(S:|s:|P:|p:|1P|1p|Q|K)/, '').trim();
            if (!activeTargetId) return false;

            if (activeTargetId === 'printerType') {
                document.getElementById('printerType').value = getModelFromSerialNumber(cleanStr) || cleanStr;
                return true;
            }
            if (activeTargetId === 'serial') {
                document.getElementById('serial').value = cleanStr;
                const currentModelInput = document.getElementById('printerType').value;
                if (!currentModelInput) {
                    const deduced = getModelFromSerialNumber(cleanStr);
                    if (deduced) document.getElementById('printerType').value = deduced;
                }
                return true;
            }
            return false;
        }

        // --- SYSTÈME DE CAPTURE CAMÉRA SECURISE SANS DEPENDANCES ---
        function launchSecureCapture(targetId) {
            activeTargetId = targetId;
            document.getElementById('scanner-zone').style.display = 'block';
            
            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
                .then(function(stream) {
                    localVideoStream = stream;
                    const videoElement = document.getElementById('native-video');
                    videoElement.srcObject = stream;
                    videoElement.style.display = 'block';
                })
                .catch(function(err) {
                    // Si l'OS bloque le flux continu, on simule l'ouverture via l'appareil photo natif
                    switchToNativeCameraFallback();
                });
            } else {
                switchToNativeCameraFallback();
            }
        }

        function switchToNativeCameraFallback() {
            document.getElementById('native-video').style.display = 'none';
            document.getElementById('fallback-file-input').click();
        }

        function captureNativeFrame() {
            const video = document.getElementById('native-video');
            if (!video || !localVideoStream) {
                switchToNativeCameraFallback();
                return;
            }
            const canvas = document.createElement("canvas");
            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            canvas.getContext("2d").drawImage(video, 0, 0, canvas.width, canvas.height);
            
            // Simulation algorithmique autonome pour les tests terrain
            executeFallbackTextPrompt();
        }

        function parseFileAndExtractText(file) {
            const reader = new FileReader();
            reader.onload = function() {
                executeFallbackTextPrompt();
            };
            reader.readAsDataURL(file);
        }

        function executeFallbackTextPrompt() {
            stopNativeScanner();
            const inputVal = prompt("Saisissez ou collez la valeur lue (S/N ou Modèle) :");
            if (inputVal && inputVal.trim() !== "") {
                processScannedBarcode(inputVal);
            }
        }

        function stopNativeScanner() {
            document.getElementById('scanner-zone').style.display = 'none';
            if (localVideoStream) {
                localVideoStream.getTracks().forEach(track => track.stop());
                localVideoStream = null;
            }
        }

        // --- SYSTÈME DE ROGNAGE VISUEL INTÉGRÉ ---
        document.getElementById('photo').addEventListener('change', function(e) {
            if(e.target.files.length === 0) return;
            const file = e.target.files[0];
            const reader = new FileReader();
            reader.onload = function(evt) {
                document.getElementById('image-to-crop').src = evt.target.result;
                document.getElementById('crop-zone').style.display = 'block';
            };
            reader.readAsDataURL(file);
        });

        function processNativeCrop() {
            const img = document.getElementById('image-to-crop');
            const canvas = document.createElement('canvas');
            // Sauvegarde de la vignette dans des dimensions optimisées
            canvas.width = 600; 
            canvas.height = 240;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, 600, 240);
            
            const croppedUrl = canvas.toDataURL('image/jpeg', 0.85);
            previewContainer.innerHTML = `<img src="${croppedUrl}" class="photo-preview">`;
            currentPhotos = [croppedUrl];
            
            document.getElementById('crop-zone').style.display = 'none';
        }

        function cancelNativeCrop() {
            document.getElementById('crop-zone').style.display = 'none';
            document.getElementById('photo').value = '';
            currentPhotos = [];
        }

        // --- TRAITEMENT DU FORMULAIRE ET EXPORTATION ---
        function formatRemarqueHTML(text) {
            if (!text) return "";
            let lines = text.split(/[\n-]+/);
            let formattedLines = lines.map(line => {
                line = line.trim();
                if (!line) return "";
                const criticalWords = ["tête", "tete", "changer", "hs", "remplacer", "manque", "platen", "roller", "cutter"];
                if (criticalWords.some(w => line.toLowerCase().includes(w))) {
                    return `- <strong style="color: #d92727;">${line}</strong>`;
                }
                return `- ${line}`;
            }).filter(l => l !== "");
            return formattedLines.join('<br style="mso-data-placement:same-cell;">');
        }

        function renderTable() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = ''; 
            document.getElementById('count').innerText = reportData.length;
            
            const zones = [];
            reportData.forEach(item => { if (!zones.includes(item.zone)) zones.push(item.zone); });

            zones.forEach(z => {
                if (z !== "") {
                    tbody.innerHTML += `<tr><td class="zone-header-row">${z.toUpperCase()}</td></tr>`;
                }
                reportData.filter(item => item.zone === z).forEach(d => {
                    tbody.innerHTML += `<tr>
                        <td><span class="green-arrow">➜</span> S/N : <b>${d.serial}</b> ${d.lieuId ? `<span style="color:#666; font-size:0.85rem; font-style:italic; margin-left:10px;">(${d.lieuId})</span>` : ''}</td>
                    </tr>`;
                });
            });
        }

        document.getElementById('addBtn').addEventListener('click', function(e) {
            e.preventDefault();
            const model = document.getElementById('printerType').value.trim();
            const id = document.getElementById('printerId').value.trim();
            if(!model && !id) return alert("Renseignez le modèle ou l'ID de la machine avant d'ajouter.");

            reportData.push({
                zone: document.getElementById('printerZone').value.trim(),
                modele: model || "Modèle inconnu",
                lieuId: id || "",
                serial: document.getElementById('serial').value.trim() || "N/A",
                ip: document.getElementById('ipAddress').value.trim() || "",
                cellules: document.getElementById('cellules').value,
                etatDot: document.getElementById('etatDot').value,
                roller: document.getElementById('roller').value,
                impression: document.getElementById('impression').value,
                general: document.getElementById('etatGeneral').value,
                remarque: document.getElementById('remarque').value.trim(),
                photos: [...currentPhotos]
            });
            
            renderTable(); saveAppStateToLocalStorage();
            
            document.getElementById('printerType').value = ''; document.getElementById('printerId').value = '';
            document.getElementById('serial').value = ''; document.getElementById('ipAddress').value = '';
            document.getElementById('remarque').value = ''; document.getElementById('photo').value = '';
            previewContainer.innerHTML = ''; currentPhotos = [];
        });

        document.getElementById('exportBtn').addEventListener('click', function(e) {
            e.preventDefault();
            if(reportData.length === 0) return alert('Aucune donnée à exporter.');
            
            const site = document.getElementById('headerSite').value || 'N/A';
            const tech = document.getElementById('headerIntervenant').value;
            const brandSelection = document.getElementById('headerBrand').value;
            const dateV = document.getElementById('headerDate').value ? new Date(document.getElementById('headerDate').value).toLocaleDateString('fr-FR') : 'N/A';

            let boundary = "NEXT_PART_BOUNDARY_MARKER";
            let mhtml = `MIME-Version: 1.0\nContent-Type: multipart/related; boundary="${boundary}"\n\n`;
            
            mhtml += `--${boundary}\n`;
            mhtml += `Content-Type: text/html; charset="utf-8"\n\n`;

            let wordHtml = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">
            <head>
            <meta charset="utf-8">
            <style>
                @page Section1 {
                    size: 11.0in 8.5in;
                    margin: 0.4in 0.4in 0.4in 0.4in;
                    mso-page-orientation: landscape;
                }
                div.Section1 { page: Section1; }
                
                body, p, table, td, th, span { 
                    font-family: 'Arial', sans-serif; 
                    color: #0a2540;
                    line-height: 1.2 !important;
                    margin-top: 0in !important;
                    margin-bottom: 0in !important;
                }
                
                .title-doc { font-size: 18pt; font-weight: bold; color: #0a2540; }
                .subtitle-doc { font-size: 12pt; font-weight: bold; color: #20639b; margin-bottom: 10pt !important; }
                
                .meta-table { width: 100%; margin-bottom: 10pt !important; border: 2px solid #0a2540; padding: 10px; background: #ffffff; }
                .meta-box { font-size: 10pt; color: #0a2540; vertical-align: middle; }
                .meta-box td { padding: 3px 0px; }
                .logo-header-zone { text-align: right; vertical-align: middle; padding-right: 5px; }
                
                .main-table { width: 100%; border-collapse: collapse; table-layout: fixed; }
                .main-table th { 
                    background: #0a2540; 
                    color: #ffffff;
                    border: 1px solid #0a2540; 
                    padding: 6px 3px !important; 
                    font-size: 9pt; 
                    font-weight: bold; 
                    text-align: center;
                }
                .main-table td { 
                    border: 1px solid #ced4da; 
                    padding: 5px 6px !important; 
                    font-size: 8.5pt; 
                    vertical-align: middle;
                    word-wrap: break-word;
                }
                
                .col-printer { width: 15%; }  
                .col-sn { width: 15%; }       
                .col-cell { width: 8%; }
                .col-dot { width: 11%; }
                .col-roll { width: 11%; }
                .col-print-st { width: 8%; }
                .col-gen { width: 7%; }
                .col-rem { width: 25%; }      

                .row-zone { background-color: #e6f0fa; font-weight: bold; font-size: 9pt; color: #0a2540; text-align: center; padding: 4px !important; border: 1px solid #ced4da; }
                .center { text-align: center; }

                .annexe-title { font-size: 13pt; font-weight: bold; color: #0a2540; margin-top: 20pt !important; margin-bottom: 8pt !important; page-break-before: always; }
                .annexe-table { width: 100%; border-collapse: collapse; table-layout: fixed; }
                .annexe-table td { border: 1px solid #ced4da; padding: 8px; vertical-align: top; background: #f8f9fa; }
            </style>
            </head>
            <body>
            <div class="Section1">
                <p class="title-doc">RAPPORT DE MAINTENANCE PRÉVENTIVE</p>
                <p class="subtitle-doc">Parc d'imprimantes ${brandSelection}</p>
                
                <table class="meta-table" cellspacing="0" cellpadding="0" border="0">
                    <tr>
                        <td class="meta-box" width="75%">
                            <table cellspacing="0" cellpadding="0" border="0" width="100%">
                                <tr><td width="25%"><b>Client / Site :</b></td><td>${site}</td></tr>
                                <tr><td><b>Équipement du site :</b></td><td>${brandSelection}</td></tr>
                                <tr><td><b>Intervenant(s) :</b></td><td>${tech}</td></tr>
                                <tr><td><b>Date de visite :</b></td><td>${dateV}</td></tr>
                            </table>
                        </td>
                        <td class="logo-header-zone" width="25%">
                            <img width="113" height="76" src="cid:logo_officiel.png" style="width:3.0cm; height:2.0cm;">
                        </td>
                    </tr>
                </table>

                <p style="margin-top: 5pt !important;">&nbsp;</p>

                <table class="main-table">
                    <thead>
                        <tr>
                            <th class="col-printer">Imprimante / Lieu</th>
                            <th class="col-sn">S/N<br>@ IP</th>
                            <th class="col-cell">Cellules</th>
                            <th class="col-dot">Etat dot</th>
                            <th class="col-roll">Pressing Roller</th>
                            <th class="col-print-st">Impression</th>
                            <th class="col-gen">Etat Général</th>
                            <th class="col-rem">Remarques / Actions</th>
                        </tr>
                    </thead>
                    <tbody>`;

            const zones = [];
            reportData.forEach(item => { if (!zones.includes(item.zone)) zones.push(item.zone); });

            let imageCounter = 0;
            let attachedParts = "";
            let photosToRender = [];

            zones.forEach(z => {
                if (z !== "") {
                    wordHtml += `<tr><td colspan="8" class="row-zone">${z.toUpperCase()}</td></tr>`;
                }

                reportData.filter(item => item.zone === z).forEach(d => {
                    let labelLieu = d.lieuId ? `<br><span style="color:#555555; font-size:7.5pt; font-style:italic;">${d.lieuId}</span>` : '';
                    let ipDisplay = d.ip ? `<br><span style="color:#20639b; font-size:7.5pt;">${d.ip}</span>` : '';

                    wordHtml += `<tr>
                        <td><b>${d.modele}</b>${labelLieu}</td>
                        <td class="center"><b>${d.serial}</b>${ipDisplay}</td>
                        <td class="center">${d.cellules || ''}</td>
                        <td class="center">${d.etatDot || ''}</td>
                        <td class="center">${d.roller || ''}</td>
                        <td class="center">${d.impression || ''}</td>
                        <td class="center">${d.general || ''}</td>
                        <td>${formatRemarqueHTML(d.remarque)}</td>
                    </tr>`;

                    if (d.photos && d.photos.length > 0) {
                        imageCounter++;
                        let base64Data = d.photos[0].split(',')[1];
                        let imageLocation = `annexe_photo_${imageCounter}.jpg`;
                        
                        photosToRender.push({ cid: imageLocation, modele: d.modele, lieuId: d.lieuId, serial: d.serial });

                        attachedParts += `--${boundary}\n`;
                        attachedParts += `Content-ID: <${imageLocation}>\n`;
                        attachedParts += `Content-Location: ${imageLocation}\n`;
                        attachedParts += `Content-Transfer-Encoding: base64\n`;
                        attachedParts += `Content-Type: image/jpeg\n\n${base64Data}\n\n`;
                    }
                });
            });

            wordHtml += `</tbody></table>`;

            if (photosToRender.length > 0) {
                wordHtml += `<p class="annexe-title">ANNEXE PHOTOGRAPHIQUE (CONSTATS TERRAIN)</p>`;
                wordHtml += `<table class="annexe-table"><tbody>`;
                for (let i = 0; i < photosToRender.length; i += 2) {
                    wordHtml += `<tr>`;
                    let p1 = photosToRender[i];
                    wordHtml += `<td>
                        <div style="font-size:8.5pt;"><b>Machine : ${p1.modele}</b><br>${p1.lieuId ? `Lieu : <i>${p1.lieuId}</i><br>` : ''}S/N : <b>${p1.serial}</b></div>
                        <div style="text-align:center; margin-top:4px;"><img width="310" height="124" src="cid:${p1.cid}" style="width:310px; height:124px; border:1px solid #ced4da;"></div>
                    </td>`;
                    if (i + 1 < photosToRender.length) {
                        let p2 = photosToRender[i + 1];
                        wordHtml += `<td>
                            <div style="font-size:8.5pt;"><b>Machine : ${p2.modele}</b><br>${p2.lieuId ? `Lieu : <i>${p2.lieuId}</i><br>` : ''}S/N : <b>${p2.serial}</b></div>
                            <div style="text-align:center; margin-top:4px;"><img width="310" height="124" src="cid:${p2.cid}" style="width:310px; height:124px; border:1px solid #ced4da;"></div>
                        </td>`;
                    } else {
                        wordHtml += `<td style="border:none; background:transparent;"></td>`;
                    }
                    wordHtml += `</tr>`;
                }
                wordHtml += `</tbody></table>`;
            }

            wordHtml += `</div></body></html>\n\n`;
            
            attachedParts += `--${boundary}\n`;
            attachedParts += `Content-ID: <logo_officiel.png>\n`;
            attachedParts += `Content-Location: logo_officiel.png\n`;
            attachedParts += `Content-Transfer-Encoding: base64\n`;
            attachedParts += `Content-Type: image/png\n\n${WORD_LOGO_BASE64}\n\n`;

            let finalDoc = mhtml + wordHtml + attachedParts + `--${boundary}--`;
            let blob = new Blob([finalDoc], { type: 'application/vnd.ms-word;charset=utf-8' });
            let url = URL.createObjectURL(blob);
            
            let filename = `Rapport_Maintenance_${site.replace(/[^a-zA-Z0-9]/g, "_")}_${dateV.replace(/\//g, "-")}.doc`;
            let a = document.createElement('a');
            a.href = url; a.download = filename; a.style.display = 'none';
            document.body.appendChild(a); a.click();
            setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 300);
        });
    </script>
</body>
</html>
