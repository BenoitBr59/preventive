<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rapport de Maintenance Préventive</title>
    
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.js"></script>

    <style>
        :root {
            --primary: #0a2540; /* Bleu Nuit du Logo */
            --accent: #d92727;  /* Rouge Vif du Logo */
            --bg: #f4f7fa;      /* Fond très légèrement bleuté */
            --card-bg: #ffffff;
            --secondary-blue: #20639b; /* Bleu secondaire */
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--primary);
            margin: 0;
            padding: 15px;
        }

        header {
            background: var(--primary);
            color: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            border-bottom: 4px solid var(--accent);
            display: flex;
            flex-direction: row;
            align-items: center; /* Aligne verticalement le logo et le contenu */
            gap: 20px;
        }

        /* LOGO REPLACÉ À GAUCHE ET CENTRÉ VERTICALEMENT */
        .header-logo-container {
            background: white;
            padding: 6px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 115px;
            height: 78px;
            box-sizing: border-box;
            flex-shrink: 0;
        }

        .header-logo-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .header-left {
            flex: 1;
        }

        header h1 { 
            margin: 0 0 12px 0; 
            font-size: 1.4rem; 
            color: #ffffff; 
        }

        .header-inputs {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .header-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-group label {
            font-size: 0.9rem;
            opacity: 0.9;
            min-width: 130px;
            font-weight: normal;
            margin: 0;
            color: white;
        }

        .header-group input, .header-group select {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 0.9rem;
            height: 35px;
            flex: 1;
            box-sizing: border-box;
        }

        .header-group select option {
            background-color: var(--primary);
            color: white;
        }

        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(10,37,64,0.08);
            margin-bottom: 20px;
        }

        h3 {
            color: var(--primary);
            margin-top: 0;
            border-bottom: 2px solid #e1e8ed;
            padding-bottom: 8px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 0.9rem;
            color: var(--primary);
        }

        .input-scan-group {
            display: flex;
            gap: 8px;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ced4da;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 1rem;
            background-color: #fff;
            height: 45px;
            color: var(--primary);
        }

        textarea { height: auto; }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--secondary-blue);
            box-shadow: 0 0 0 3px rgba(32,99,155,0.15);
        }

        .btn-scan {
            width: auto;
            padding: 0 15px;
            background: var(--primary);
            color: white;
            border: 1px solid var(--primary);
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
        }

        #scanner-zone {
            display: none;
            margin: 15px 0;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            padding: 10px;
        }

        #reader { width: 100%; background: #000; }

        .scanner-controls {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .btn-action-scanner {
            flex: 1;
            padding: 12px;
            text-align: center;
            font-weight: bold;
            cursor: pointer;
            border-radius: 6px;
            color: white;
            font-size: 0.95rem;
        }

        .btn-capture { background: #28a745; }
        .btn-close { background: var(--accent); }

        #crop-zone {
            display: none;
            background: #111;
            padding: 15px;
            border-radius: 12px;
            margin: 15px 0;
            color: white;
            text-align: center;
        }
        .crop-container {
            max-width: 100%;
            height: 320px;
            margin: 10px auto;
            background: #222;
            border-radius: 6px;
            overflow: hidden;
        }
        .crop-container img { max-width: 100%; max-height: 100%; display: block; }
        .crop-buttons { display: flex; gap: 10px; margin-top: 15px; }
        .crop-buttons button {
            flex: 1;
            padding: 14px;
            font-size: 0.95rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .grid-status {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .status-box {
            background: #f8f9fa;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #e1e8ed;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-add { background: var(--secondary-blue); color: white; margin-top: 10px; }
        .btn-export { background: var(--accent); color: white; margin-top: 20px; }

        .photo-container {
            margin-top: 10px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .photo-preview {
            width: 100px;
            height: 40px;
            object-fit: fill;
            border-radius: 4px;
            border: 1px solid var(--secondary-blue);
        }

        .table-container {
            overflow-x: auto;
            margin-top: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.95rem;
            margin-bottom: 20px;
        }

        th, td {
            border: 1px solid #ced4da;
            padding: 10px;
            text-align: left;
        }

        th { background: #f8f9fa; font-weight: bold; color: var(--primary); }

        .zone-header-row {
            background-color: #e6f0fa !important;
            font-weight: bold;
            color: var(--primary);
            font-size: 0.95rem;
            text-align: center;
            padding: 6px;
            border-left: 4px solid var(--secondary-blue);
        }

        .green-arrow {
            color: #28a745;
            font-weight: bold;
            margin-right: 5px;
        }

        /* Alignement du logo applicatif en bas de page à gauche */
        .footer-logo-container {
            display: flex;
            justify-content: flex-start;
            align-items: center;
            margin-top: 30px;
            padding-top: 15px;
            border-top: 1px solid #e1e8ed;
        }
        .footer-logo {
            width: 113px;
            height: 76px;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-logo-container">
            <img id="app-header-img" src="" alt="Logo">
        </div>
        
        <div class="header-left">
            <h1>Visite de Maintenance Préventive</h1>
            <div class="header-inputs">
                <div class="header-group">
                    <label for="headerSite">Client / Site :</label>
                    <input type="text" id="headerSite" placeholder="Nom du client ou du site...">
                </div>
                <div class="header-group">
                    <label for="headerBrand">Équipement du site :</label>
                    <select id="headerBrand">
                        <option value="ZEBRA">Imprimantes ZEBRA</option>
                        <option value="INTERMEC">Imprimantes INTERMEC</option>
                        <option value="HONEYWELL">Imprimantes HONEYWELL</option>
                        <option value="ZEBRA & INTERMEC">Imprimantes ZEBRA & INTERMEC</option>
                    </select>
                </div>
                <div class="header-group">
                    <label for="headerIntervenant">Intervenant(s) :</label>
                    <select id="headerIntervenant">
                        <option value="Pascal CARTON & Benoit BRACKMAN">Pascal CARTON & Benoit BRACKMAN</option>
                        <option value="Pascal CARTON">Pascal CARTON</option>
                        <option value="Benoit BRACKMAN">Benoit BRACKMAN</option>
                    </select>
                </div>
                <div class="header-group">
                    <label for="headerDate">Date de visite :</label>
                    <input type="date" id="headerDate">
                </div>
            </div>
        </div>
    </header>

    <div id="scanner-zone">
        <div id="reader"></div>
        <div class="scanner-controls">
            <div class="btn-action-scanner btn-capture" onclick="forceCaptureAndDecode()">⚡ LIRE CE VISUEL</div>
            <div class="btn-action-scanner btn-close" onclick="stopScanner()">Fermer</div>
        </div>
    </div>

    <div id="crop-zone">
        <h4 style="margin-top:0;">Recadrez l'élément à conserver (Format 10x4)</h4>
        <div class="crop-container">
            <img id="image-to-crop" src="" alt="A découper">
        </div>
        <div class="crop-buttons">
            <button type="button" style="background:#28a745; color:white;" onclick="validateCrop()">Valider la sélection</button>
            <button type="button" style="background:var(--accent); color:white;" onclick="cancelCrop()">Annuler</button>
        </div>
    </div>

    <div class="card">
        <h3>Saisie Machine</h3>
        <form id="maintenanceForm" onsubmit="return false;">
            
            <div class="form-group">
                <label for="printerZone">Zone / Secteur (Facultatif)</label>
                <input type="text" id="printerZone" placeholder="Ex: LOGISTIQUE 1, SECTEUR BOL...">
            </div>

            <div class="form-group">
                <label for="printerType">Imprimante (Modèle & Type de tête)</label>
                <div class="input-scan-group">
                    <input type="text" id="printerType" placeholder="Ex: ZT420 8 DOTS, ZT231...">
                    <button type="button" class="btn-scan" onclick="startScanner('printerType')">📷 Scan</button>
                </div>
            </div>

            <div class="form-group">
                <label for="printerId">Machine ID (Lieu / Optionnel)</label>
                <input type="text" id="printerId" placeholder="Saisir l'ID ou le Lieu au clavier...">
            </div>

            <div class="form-group">
                <label for="serial">S/N (Numéro de série)</label>
                <div class="input-scan-group">
                    <input type="text" id="serial" placeholder="Flasher le S/N en ligne...">
                    <button type="button" class="btn-scan" onclick="startScanner('serial')">📷 Scan</button>
                </div>
            </div>

            <div class="form-group">
                <label for="ipAddress">@ IP</label>
                <input type="text" id="ipAddress" placeholder="Ex: 192.168.1.50">
            </div>

            <div class="form-group">
                <label>Vérifications terrain</label>
                <div class="grid-status">
                    <div class="status-box">
                        <label style="font-size:0.8rem;">Cellules</label>
                        <select id="cellules">
                            <option value="OK">OK</option>
                            <option value="NOK">NOK</option>
                            <option value="">Non renseigné</option>
                        </select>
                    </div>
                    <div class="status-box">
                        <label style="font-size:0.8rem;">Etat dot</label>
                        <select id="etatDot">
                            <option value="OK">OK</option>
                            <option value="Nombreuses dots HS">Nombreuses dots HS</option>
                            <option value="Défaut dots">Défaut dots / HS</option>
                            <option value="NOK">NOK</option>
                            <option value="">Non renseigné</option>
                        </select>
                    </div>
                    <div class="status-box">
                        <label style="font-size:0.8rem;">Pressing Roller</label>
                        <select id="roller">
                            <option value="OK">OK</option>
                            <option value="Cutter">Cutter (Coup de cutter)</option>
                            <option value="Coups de cutter">Coups de cutter</option>
                            <option value="NOK">NOK</option>
                            <option value="">Non renseigné</option>
                        </select>
                    </div>
                    <div class="status-box">
                        <label style="font-size:0.8rem;">Impression</label>
                        <select id="impression">
                            <option value="OK">OK</option>
                            <option value="NOK">NOK</option>
                            <option value="">Non renseigné</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label for="etatGeneral">Etat Général</label>
                <select id="etatGeneral">
                    <option value="OK">OK</option>
                    <option value="Voir Rem">Voir Rem</option>
                    <option value="Non vu">Non vu</option>
                </select>
            </div>

            <div class="form-group">
                <label for="remarque">Remarques / Actions à mener (Utilisez le tiret '-' pour aller à la ligne)</label>
                <textarea id="remarque" rows="3" placeholder="Saisir les remarques... Ex: - Nettoyage effectué - Tête à changer"></textarea>
            </div>

            <div class="
