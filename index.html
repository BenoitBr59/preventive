<!-- INFOS -->
<div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6 p-4 rounded-lg border sb">
  <div>
    <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Client / Site</label>
    <input type="text" id="hSite" oninput="save()" class="w-full bg-white border border-gray-300 rounded px-3 py-2 text-sm" placeholder="Ex: Site Paris">
  </div>
  <div>
    <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Intervenant</label>
    <select id="hInterv" onchange="save()" class="w-full bg-white border border-gray-300 rounded px-3 py-2 text-sm">
      <option value="">-- Choisir --</option>
      <option>Pascal CARTON</option>
      <option>Benoît BRACKMAN</option>
      <option>Pascal CARTON / Benoît BRACKMAN</option>
    </select>
  </div>
  <div>
    <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Parc imprimante</label>
    <select id="hBrand" onchange="save()" class="w-full bg-white border border-gray-300 rounded px-3 py-2 text-sm">
      <option>ZEBRA</option><option>HONEYWELL</option><option>TOSHIBA</option><option>INTERMEC</option>
    </select>
  </div>
  <div>
    <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Date</label>
    <input type="date" id="hDate" onchange="save()" class="w-full bg-white border border-gray-300 rounded px-3 py-2 text-sm">
  </div>
</div>

<!-- FORMULAIRE -->
<form id="theForm" onsubmit="ajouterEquip(event)" class="p-4 rounded-lg border mb-6 grid grid-cols-1 md:grid-cols-4 gap-4 sb">
  <div class="md:col-span-4">
    <h3 class="text-sm font-bold text-blue-950 uppercase border-b pb-1 mb-2">Ajouter un équipement</h3>
  </div>
  <div>
    <label class="block text-xs font-medium text-gray-700 mb-1">Zone / Emplacement</label>
    <input type="text" id="fZone" class="w-full bg-white border border-gray-300 rounded px-3 py-1.5 text-sm" placeholder="Ex: Expédition">
  </div>
  <div>
    <label class="block text-xs font-medium text-gray-700 mb-1">Modèle (P/N)</label>
    <input type="text" id="fModele" class="w-full bg-yellow-50 border border-gray-300 rounded px-3 py-1.5 text-sm font-semibold" placeholder="Scanné ou saisi" required>
  </div>
  <div>
    <label class="block text-xs font-medium text-gray-700 mb-1">Machine ID / Lieu</label>
    <input type="text" id="fLieu" class="w-full bg-white border border-gray-300 rounded px-3 py-1.5 text-sm" placeholder="ID Interne">
  </div>
  <div>
    <label class="block text-xs font-medium text-gray-700 mb-1">Numéro de Série (S/N)</label>
    <div class="flex">
      <input type="text" id="fSerial" class="w-full bg-white border border-gray-300 rounded-l px-3 py-1.5 text-sm font-bold" placeholder="S/N" required>
      <button type="button" onclick="ouvrirScanner()" class="bs rounded-r px-4 text-xs font-bold whitespace-nowrap flex items-center gap-1.5">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h2M7 5h1M3 5v2M21 5h-2M17 5h-1M21 5v2M3 19h2M7 19h1M3 19v-2M21 19h-2M17 19h-1M21 19v-2"/><rect x="7" y="8" width="10" height="8" rx="1"/><line x1="5" y1="12" x2="7" y2="12"/><line x1="17" y1="12" x2="19" y2="12"/></svg>
        SCANNER
      </button>
    </div>
  </div>
  <div class="md:col-span-2 grid grid-cols-2 gap-4 bg-white p-3 rounded border border-gray-200">
    <div>
