<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rapport de Maintenance Préventive</title>
    
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.js"></script>

    <style>
        :root {
            --primary: #0a2540; /* Bleu Nuit du Logo */
            --accent: #d92727;  /* Rouge Vif du Logo */
            --bg: #f4f7fa;      /* Fond très légèrement bleuté */
            --card-bg: #ffffff;
            --secondary-blue: #20639b; /* Bleu secondaire pour les sous-sections */
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--primary);
            margin: 0;
            padding: 15px;
        }

        header {
            background: var(--primary);
            color: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            border-bottom: 4px solid var(--accent);
        }

        header h1 { 
            margin: 0 0 15px 0; 
            font-size: 1.4rem; 
            color: #ffffff; 
        }

        .header-inputs {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .header-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-group label {
            font-size: 0.9rem;
            opacity: 0.9;
            min-width: 130px;
            font-weight: normal;
            margin: 0;
        }

        .header-group input, .header-group select {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 0.9rem;
            height: 35px;
            flex: 1;
            box-sizing: border-box;
        }

        .header-group select option {
            background-color: var(--primary);
            color: white;
        }

        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(10,37,64,0.08);
            margin-bottom: 20px;
        }

        h3 {
            color: var(--primary);
            margin-top: 0;
            border-bottom: 2px solid #e1e8ed;
            padding-bottom: 8px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 0.9rem;
            color: var(--primary);
        }

        .input-scan-group {
            display: flex;
            gap: 8px;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ced4da;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 1rem;
            background-color: #fff;
            height: 45px;
            color: var(--primary);
        }

        textarea { height: auto; }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--secondary-blue);
            box-shadow: 0 0 0 3px rgba(32,99,155,0.15);
        }

        .btn-scan {
            width: auto;
            padding: 0 15px;
            background: var(--primary);
            color: white;
            border: 1px solid var(--primary);
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
        }
        .btn-scan:active { background: var(--secondary-blue); }

        #scanner-zone {
            display: none;
            margin: 15px 0;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            padding: 10px;
        }

        #reader { width: 100%; background: #000; }

        .scanner-controls {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .btn-action-scanner {
            flex: 1;
            padding: 12px;
            text-align: center;
            font-weight: bold;
            cursor: pointer;
            border-radius: 6px;
            color: white;
            font-size: 0.95rem;
        }

        .btn-capture { background: #28a745; }
        .btn-close { background: var(--accent); }

        #crop-zone {
            display: none;
            background: #111;
            padding: 15px;
            border-radius: 12px;
            margin: 15px 0;
            color: white;
            text-align: center;
        }
        .crop-container {
            max-width: 100%;
            height: 320px;
            margin: 10px auto;
            background: #222;
            border-radius: 6px;
            overflow: hidden;
        }
        .crop-container img { max-width: 100%; max-height: 100%; display: block; }
        .crop-buttons { display: flex; gap: 10px; margin-top: 15px; }
        .crop-buttons button {
            flex: 1;
            padding: 14px;
            font-size: 0.95rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .grid-status {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .status-box {
            background: #f8f9fa;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #e1e8ed;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-add { background: var(--secondary-blue); color: white; margin-top: 10px; }
        .btn-add:active { background: var(--primary); }
        .btn-export { background: var(--accent); color: white; margin-top: 20px; }
        .btn-export:active { background: #b31e1e; }

        .photo-container {
            margin-top: 10px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .photo-preview {
            width: 100px;
            height: 40px;
            object-fit: fill;
            border-radius: 4px;
            border: 1px solid var(--secondary-blue);
        }

        .table-container {
            overflow-x: auto;
            margin-top: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.95rem;
            margin-bottom: 20px;
        }

        th, td {
            border: 1px solid #ced4da;
            padding: 10px;
            text-align: left;
        }

        th { background: #f8f9fa; font-weight: bold; color: var(--primary); }

        .zone-header-row {
            background-color: #e6f0fa !important;
            font-weight: bold;
            color: var(--primary);
            font-size: 0.95rem;
            text-align: center;
            padding: 6px;
            border-left: 4px solid var(--secondary-blue);
        }

        .green-arrow {
            color: #28a745;
            font-weight: bold;
            margin-right: 5px;
        }

        /* Container du Logo en bas de page (3cm x 2cm convertis pour écran) */
        .footer-logo-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 30px;
            padding-top: 15px;
            border-top: 1px solid #e1e8ed;
        }
        .footer-logo {
            width: 113px;  /* Proche de 3cm écran */
            height: 76px;  /* Proche de 2cm écran */
            object-fit: contain;
        }
    </style>
</head>
<body>

    <header>
        <h1>Visite de Maintenance Préventive</h1>
        <div class="header-inputs">
            <div class="header-group">
                <label for="headerSite">Client / Site :</label>
                <input type="text" id="headerSite" placeholder="Nom du client ou du site...">
            </div>
            <div class="header-group">
                <label for="headerBrand">Équipement du site :</label>
                <select id="headerBrand">
                    <option value="ZEBRA">Imprimantes ZEBRA</option>
                    <option value="INTERMEC">Imprimantes INTERMEC</option>
                    <option value="HONEYWELL">Imprimantes HONEYWELL</option>
                    <option value="ZEBRA & INTERMEC">Imprimantes ZEBRA & INTERMEC</option>
                </select>
            </div>
            <div class="header-group">
                <label for="headerIntervenant">Intervenant(s) :</label>
                <select id="headerIntervenant">
                    <option value="Pascal CARTON & Benoit BRACKMAN">Pascal CARTON & Benoit BRACKMAN</option>
                    <option value="Pascal CARTON">Pascal CARTON</option>
                    <option value="Benoit BRACKMAN">Benoit BRACKMAN</option>
                </select>
            </div>
            <div class="header-group">
                <label for="headerDate">Date de visite :</label>
                <input type="date" id="headerDate">
            </div>
        </div>
    </header>

    <div id="scanner-zone">
        <div id="reader"></div>
        <div class="scanner-controls">
            <div class="btn-action-scanner btn-capture" onclick="forceCaptureAndDecode()">⚡ LIRE CE VISUEL</div>
            <div class="btn-action-scanner btn-close" onclick="stopScanner()">Fermer</div>
        </div>
    </div>

    <div id="crop-zone">
        <h4 style="margin-top:0;">Recadrez l'élément à conserver (Format 10x4)</h4>
        <div class="crop-container">
            <img id="image-to-crop" src="" alt="A découper">
        </div>
        <div class="crop-buttons">
            <button type="button" style="background:#28a745; color:white;" onclick="validateCrop()">Valider la sélection</button>
            <button type="button" style="background:var(--accent); color:white;" onclick="cancelCrop()">Annuler</button>
        </div>
    </div>

    <div class="card">
        <h3>Saisie Machine</h3>
        <form id="maintenanceForm" onsubmit="return false;">
            
            <div class="form-group">
                <label for="printerZone">Zone / Secteur (Facultatif)</label>
                <input type="text" id="printerZone" placeholder="Ex: LOGISTIQUE 1, SECTEUR BOL...">
            </div>

            <div class="form-group">
                <label for="printerType">Imprimante (Modèle & Type de tête)</label>
                <div class="input-scan-group">
                    <input type="text" id="printerType" placeholder="Ex: ZT420 8 DOTS, ZT231...">
                    <button type="button" class="btn-scan" onclick="startScanner('printerType')">📷 Scan</button>
                </div>
            </div>

            <div class="form-group">
                <label for="printerId">Machine ID (Lieu / Optionnel)</label>
                <input type="text" id="printerId" placeholder="Saisir l'ID ou le Lieu au clavier...">
            </div>

            <div class="form-group">
                <label for="serial">S/N (Numéro de série)</label>
                <div class="input-scan-group">
                    <input type="text" id="serial" placeholder="Flasher le S/N en ligne...">
                    <button type="button" class="btn-scan" onclick="startScanner('serial')">📷 Scan</button>
                </div>
            </div>

            <div class="form-group">
                <label for="ipAddress">@ IP</label>
                <input type="text" id="ipAddress" placeholder="Ex: 172.16.82.52">
            </div>

            <div class="form-group">
                <label>Vérifications terrain</label>
                <div class="grid-status">
                    <div class="status-box">
                        <label style="font-size:0.8rem;">Cellules</label>
                        <select id="cellules">
                            <option value="OK">OK</option>
                            <option value="NOK">NOK</option>
                            <option value="">Non renseigné (Non vu)</option>
                        </select>
                    </div>
                    <div class="status-box">
                        <label style="font-size:0.8rem;">Etat dot</label>
                        <select id="etatDot">
                            <option value="OK">OK</option>
                            <option value="Nombreuses dots HS">Nombreuses dots HS</option>
                            <option value="Défaut dots">Défaut dots / HS</option>
                            <option value="NOK">NOK</option>
                            <option value="">Non renseigné (Non vu)</option>
                        </select>
                    </div>
                    <div class="status-box">
                        <label style="font-size:0.8rem;">Pressing Roller</label>
                        <select id="roller">
                            <option value="OK">OK</option>
                            <option value="Cutter">Cutter (Coup de cutter)</option>
                            <option value="Coups de cutter">Coups de cutter</option>
                            <option value="NOK">NOK</option>
                            <option value="">Non renseigné (Non vu)</option>
                        </select>
                    </div>
                    <div class="status-box">
                        <label style="font-size:0.8rem;">Impression</label>
                        <select id="impression">
                            <option value="OK">OK</option>
                            <option value="NOK">NOK</option>
                            <option value="">Non renseigné (Non vu)</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label for="etatGeneral">Etat Général</label>
                <select id="etatGeneral">
                    <option value="OK">OK</option>
                    <option value="Voir Rem">Voir Rem</option>
                    <option value="Non vu">Non vu</option>
                </select>
            </div>

            <div class="form-group">
                <label for="remarque">Remarques / Actions à mener (Utilisez le tiret '-' pour aller à la ligne)</label>
                <textarea id="remarque" rows="3" placeholder="Saisir les remarques... Ex: - Nettoyage effectué - Tête à changer"></textarea>
            </div>

            <div class="form-group">
                <label for="photo">Photos des défauts / panne (Optionnel)</label>
                <input type="file" id="photo" accept="image/*" capture="environment" style="padding:5px; height:auto;">
                <div class="photo-container" id="previewContainer"></div>
            </div>

            <button type="button" class="btn-add" id="addBtn">Ajouter au tableau</button>
        </form>
    </div>

    <div class="card">
        <h3>Imprimantes enregistrées (<span id="count">0</span>)</h3>
        <div class="table-container">
            <table id="summaryTable">
                <thead>
                    <tr>
                        <th>Numéros de Série (S/N) enregistrés</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                </tbody>
            </table>
        </div>
        <button type="button" class="btn-export" id="exportBtn">Exporter le rapport officiel (.doc)</button>
    </div>

    <script>
        let reportData = [];
        const previewContainer = document.getElementById('previewContainer');
        let currentPhotos = [];
        let html5QrcodeScanner = null;
        let activeTargetId = null;

        function getModelFromSerialNumber(sn) {
            const snUpper = sn.toUpperCase().trim();
            if (snUpper.startsWith("18J")) return "ZT420 8 DOTS";
            if (snUpper.startsWith("19J")) return "ZT420 12 DOTS";
            if (snUpper.startsWith("99J")) return "ZT421 8 DOTS";
            if (snUpper.startsWith("98J")) return "ZT421 12 DOTS";
            if (snUpper.startsWith("T3J")) return "ZT231 8 DOTS";
            if (snUpper.startsWith("52J")) return "ZT230 8 DOTS";
            if (snUpper.startsWith("51J")) return "ZT220 8 DOTS";
            if (snUpper.startsWith("10J")) return "ZT410 8 DOTS";
            if (snUpper.startsWith("11J")) return "ZT411 8 DOTS";
            if (snUpper.startsWith("41J")) return "ZT510 8 DOTS";
            if (snUpper.startsWith("48J")) return "ZT610 8 DOTS";
            if (snUpper.startsWith("ZM4")) return "ZM400 8 DOTS";
            if (snUpper.startsWith("ZM6")) return "ZM600 8 DOTS";
            if (snUpper.startsWith("105SL") || snUpper.startsWith("15J")) return "105SL Plus";
            if (snUpper.startsWith("220X")) return "220Xi4";
            if (snUpper.startsWith("110X")) return "110Xi4";
            if (snUpper.startsWith("ZD4") || snUpper.startsWith("D4J")) return "ZD420 / ZD421 Desktop";
            if (snUpper.startsWith("ZD2") || snUpper.startsWith("D2J")) return "ZD220 / ZD230 Desktop";
            if (snUpper.startsWith("GK4")) return "GK420t / GK420d";
            if (snUpper.startsWith("GX4")) return "GX420 / GX430";
            if (snUpper.startsWith("307") || snUpper.startsWith("308")) return "Intermec PF4i";
            if (snUpper.startsWith("305") || snUpper.startsWith("306")) return "Intermec PM4i";
            if (snUpper.startsWith("301") || snUpper.startsWith("302")) return "Intermec PD41 / PD42";
            if (snUpper.startsWith("PM43") || snUpper.startsWith("223")) return "Honeywell PM43";
            if (snUpper.startsWith("PC43") || snUpper.startsWith("234")) return "Honeywell PC43t";
            if (snUpper.startsWith("PX4") || snUpper.startsWith("PX6")) return "Intermec PX4i / PX6i";
            return "";
        }

        function processScannedBarcode(rawValue) {
            let cleanStr = rawValue.trim();
            if (cleanStr.startsWith("[)>") || cleanStr.includes("05800") || cleanStr.includes("3056T")) {
                const patterns = /(T3J\d+|18J\d+|19J\d+|99J\d+|98J\d+|52J\d+|51J\d+|10J\d+|11J\d+|41J\d+|48J\d+|ZM\d+|307\d+|308\d+|305\d+|223\d+|234\d+)/i;
                const match = cleanStr.match(patterns);
                if (match) { cleanStr = match[1].toUpperCase(); } else {
                    cleanStr = cleanStr.replace(/^.*?3056T/i, '');
                    cleanStr = cleanStr.replace(/[^a-zA-Z0-9]/g, '');
                }
            }
            cleanStr = cleanStr.replace(/^(S:|s:|P:|p:|1P|1p|Q|K)/, '').trim();
            if (cleanStr.toUpperCase().startsWith("SERIAL #")) {
                cleanStr = cleanStr.replace(/SERIAL #\s*/i, "").trim();
            }

            if (!activeTargetId) return false;

            if (activeTargetId === 'printerType') {
                document.getElementById('printerType').value = getModelFromSerialNumber(cleanStr) || cleanStr;
                return true;
            }

            if (activeTargetId === 'serial') {
                document.getElementById('serial').value = cleanStr;
                const currentModelInput = document.getElementById('printerType').value;
                if (!currentModelInput) {
                    const deduced = getModelFromSerialNumber(cleanStr);
                    if (deduced) document.getElementById('printerType').value = deduced;
                }
                return true;
            }
            return false;
        }

        function startScanner(targetId) {
            activeTargetId = targetId;
            document.getElementById('scanner-zone').style.display = 'block';
            html5QrcodeScanner = new Html5Qrcode("reader");
            const config = {
                fps: 30,
                videoConstraints: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } },
                qrbox: function(w, h) { return { width: Math.floor(w * 0.90), height: Math.floor(h * 0.22) }; },
                formatsToSupport: [Html5QrcodeSupportedFormats.CODE_128, Html5QrcodeSupportedFormats.CODE_39]
            };
            html5QrcodeScanner.start({ facingMode: "environment" }, config,
                (txt) => { if (processScannedBarcode(txt)) { if (navigator.vibrate) navigator.vibrate(80); stopScanner(); } },
                (err) => {}
            ).catch(() => { alert("Erreur d'accès à la caméra."); document.getElementById('scanner-zone').style.display = 'none'; });
        }

        function forceCaptureAndDecode() {
            const video = document.querySelector("#reader video");
            if (!video) return;
            const canvas = document.createElement("canvas");
            canvas.width = video.videoWidth; canvas.height = video.videoHeight;
            canvas.getContext("2d").drawImage(video, 0, 0, canvas.width, canvas.height);
            html5QrcodeScanner.scanFile(canvasToBlob(canvas), false)
                .then(txt => { if (processScannedBarcode(txt)) { if (navigator.vibrate) navigator.vibrate(120); stopScanner(); } else { proposerSaisieAlternative(); } })
                .catch(() => proposerSaisieAlternative());
        }

        function canvasToBlob(canvas) {
            var dataURL = canvas.toDataURL('image/jpeg');
            var bytes = atob(dataURL.split(',')[1]);
            var arr = new ArrayBuffer(bytes.length);
            var ua = new Uint8Array(arr);
            for (var i = 0; i < bytes.length; i++) { ua[i] = bytes.charCodeAt(i); }
            return new File([arr], "capture.jpg", {type: "image/jpeg"});
        }

        function proposerSaisieAlternative() {
            const p = prompt("Code-barres non lisible automatiquement. Saisissez la valeur manuellement :");
            if (p && p.trim() !== "") { processScannedBarcode(p); stopScanner(); }
        }

        function stopScanner() {
            if (html5QrcodeScanner) {
                html5QrcodeScanner.stop().then(() => { document.getElementById('scanner-zone').style.display = 'none'; html5QrcodeScanner = null; })
                .catch(() => { document.getElementById('scanner-zone').style.display = 'none'; html5QrcodeScanner = null; });
            } else { document.getElementById('scanner-zone').style.display = 'none'; }
        }

        document.getElementById('photo').addEventListener('change', function(e) {
            if(e.target.files.length === 0) return;
            const file = e.target.files[0];
            const reader = new FileReader();
            
            reader.onload = function(evt) {
                const imageToCrop = document.getElementById('image-to-crop');
                imageToCrop.src = evt.target.result;
                document.getElementById('crop-zone').style.display = 'block';

                if(cropperInstance) { cropperInstance.destroy(); }
                
                cropperInstance = new Cropper(imageToCrop, {
                    aspectRatio: 2.5,
                    viewMode: 1,
                    autoCropArea: 0.8,
                    responsive: true,
                    restore: false,
                    guides: true,
                    highlight: false,
                    cropBoxMovable: true,
                    cropBoxResizable: true,
                    toggleDragModeOnDblclick: false
                });
            };
            reader.readAsDataURL(file);
        });

        function validateCrop() {
            if(!cropperInstance) return;
            const canvas = cropperInstance.getCroppedCanvas({ width: 1000, height: 400 });
            const croppedDataUrl = canvas.toDataURL('image/jpeg', 0.85);
            
            previewContainer.innerHTML = '';
            const previewImg = document.createElement('img');
            previewImg.src = croppedDataUrl;
            previewImg.classList.add('photo-preview');
            previewContainer.appendChild(previewImg);
            
            currentPhotos = [croppedDataUrl];
            document.getElementById('crop-zone').style.display = 'none';
            cropperInstance.destroy();
            cropperInstance = null;
        }

        function cancelCrop() {
            document.getElementById('crop-zone').style.display = 'none';
            document.getElementById('photo').value = '';
            if(cropperInstance) { cropperInstance.destroy(); cropperInstance = null; }
        }

        function formatRemarqueHTML(text) {
            if (!text) return "";
            let lines = text.split(/\s*-\s*/);
            let formattedLines = lines.map(line => {
                line = line.trim();
                if (!line) return "";
                const words = ["Tête à changer", "Tete a changer", "Prévoir", "Prevoir", "Remplacer", "Changement", "A changer", "HS"];
                if (words.some(w => line.toLowerCase().includes(w.toLowerCase()))) {
                    line = `<strong style="color: #d92727;">${line}</strong>`;
                }
                return `- ${line}`;
            }).filter(l => l !== "");
            return formattedLines.join('<br>');
        }

        function renderTable() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = ''; 
            document.getElementById('count').innerText = reportData.length;
            
            const zones = [];
            reportData.forEach(item => { if (!zones.includes(item.zone)) zones.push(item.zone); });

            zones.forEach(z => {
                const zoneData = reportData.filter(item => item.zone === z);
                if (z !== "") {
                    tbody.innerHTML += `<tr><td class="zone-header-row">${z.toUpperCase()}</td></tr>`;
                }
                zoneData.forEach(d => {
                    tbody.innerHTML += `<tr>
                        <td><span class="green-arrow">➜</span> S/N : <b>${d.serial}</b> ${d.lieuId ? `<span style="color:#666; font-size:0.85rem; font-style:italic; margin-left: 10px;">(${d.lieuId})</span>` : ''}</td>
                    </tr>`;
                });
            });
        }

            <body>
            <div class="Section1">
                <p class="title-doc">RAPPORT DE MAINTENANCE PRÉVENTIVE</p>
                <p class="subtitle-doc">${dynamicSubtitle}</p>
                
                <table class="meta-box" cellspacing="0" cellpadding="0" border="0">
                    <tr><td><b>Client / Site :</b></td><td style="padding-left:10px;">${site}</td></tr>
                    <tr><td><b>Équipement du site :</b></td><td style="padding-left:10px;">${brandSelection}</td></tr>
                    <tr><td><b>Intervenant(s) :</b></td><td style="padding-left:10px;">${tech}</td></tr>
                    <tr><td><b>Date de visite :</b></td><td style="padding-left:10px;">${dateV}</td></tr>
                </table>

                <p style="margin-top: 12pt !important; margin-bottom: 0in !important;">&nbsp;</p>

                <table class="main-table">
                    <thead>
                        <tr>
                            <th class="col-printer">Imprimante / Lieu</th>
                            <th class="col-sn">S/N<br>@ IP</th>
                            <th class="col-cell">Cellules</th>
                            <th class="col-dot">Etat dot</th>
                            <th class="col-roll">Pressing Roller</th>
                            <th class="col-print-st">Impression</th>
                            <th class="col-gen">Etat Général</th>
                            <th class="col-rem">Remarques / Actions</th>
                        </tr>
                    </thead>
                    <tbody>`;

            const zones = [];
            reportData.forEach(item => { if (!zones.includes(item.zone)) zones.push(item.zone); });

            let imageCounter = 0;
            let attachedParts = "";
            let photosToRender = [];

            zones.forEach(z => {
                const zoneData = reportData.filter(item => item.zone === z);
                if (z !== "") {
                    wordHtml += `<tr><td colspan="8" class="row-zone">${z.toUpperCase()}</td></tr>`;
                }

                zoneData.forEach(d => {
                    let labelLieu = d.lieuId ? `<br><span style="color:#555555; font-size:7.5pt; font-style:italic;">${d.lieuId}</span>` : '';
                    let ipDisplay = d.ip ? `<br><span style="color:#20639b; font-size:7.5pt;">${d.ip}</span>` : '';

                    wordHtml += `<tr>
                        <td><b>${d.modele}</b>${labelLieu}</td>
                        <td class="center"><b>${d.serial}</b>${ipDisplay}</td>
                        <td class="center">${d.cellules || ''}</td>
                        <td class="center">${d.etatDot || ''}</td>
                        <td class="center">${d.roller || ''}</td>
                        <td class="center">${d.impression || ''}</td>
                        <td class="center">${d.general || ''}</td>
                        <td>${formatRemarqueHTML(d.remarque)}</td>
                    </tr>`;

                    if (d.photos && d.photos.length > 0) {
                        imageCounter++;
                        let base64Data = d.photos[0].split(',')[1];
                        let imageLocation = `annexe_photo_${imageCounter}.jpg`;
                        
                        photosToRender.push({
                            cid: imageLocation,
                            modele: d.modele,
                            lieuId: d.lieuId,
                            serial: d.serial
                        });

                        attachedParts += `--${boundary}\n`;
                        attachedParts += `Content-ID: <${imageLocation}>\n`;
                        attachedParts += `Content-Location: ${imageLocation}\n`;
                        attachedParts += `Content-Transfer-Encoding: base64\n`;
                        attachedParts += `Content-Type: image/jpeg\n\n`;
                        attachedParts += base64Data + "\n\n";
                    }
                });
            });

            wordHtml += `</tbody></table>`;

            if (photosToRender.length > 0) {
                wordHtml += `<p class="annexe-title">ANNEXE PHOTOGRAPHIQUE (CONSTATS TERRAIN)</p>`;
                wordHtml += `<table class="annexe-table"><tbody>`;
                
                for (let i = 0; i < photosToRender.length; i += 2) {
                    wordHtml += `<tr>`;
                    
                    let p1 = photosToRender[i];
                    wordHtml += `<td>
                        <div class="photo-block">
                            <b>Machine : ${p1.modele}</b><br>
                            ${p1.lieuId ? `Lieu : <i>${p1.lieuId}</i><br>` : ''}
                            S/N : <b>${p1.serial}</b>
                        </div>
                        <div class="photo-wrapper">
                            <img width="310" height="124" src="cid:${p1.cid}" style="width:310px; height:124px; border:1px solid #ced4da;">
                        </div>
                    </td>`;
                    
                    if (i + 1 < photosToRender.length) {
                        let p2 = photosToRender[i + 1];
                        wordHtml += `<td>
                            <div class="photo-block">
                                <b>Machine : ${p2.modele}</b><br>
                                ${p2.lieuId ? `Lieu : <i>${p2.lieuId}</i><br>` : ''}
                                S/N : <b>${p2.serial}</b>
                            </div>
                            <div class="photo-wrapper">
                                <img width="310" height="124" src="cid:${p2.cid}" style="width:310px; height:124px; border:1px solid #ced4da;">
                            </div>
                        </td>`;
                    } else {
                        wordHtml += `<td style="border:none; background:transparent;"></td>`;
                    }
                    
                    wordHtml += `</tr>`;
                }
                wordHtml += `</tbody></table>`;
            }

            // --- INTÉGRATION DU LOGO EN FILET BAS DE PAGE SUR WORD (Précisément 3cm x 2cm) ---
            wordHtml += `<div class="word-footer">
                <br><br>
                <img width="113" height="76" src="cid:logo_officiel.png" style="width:3.0cm; height:2.0cm;">
            </div>`;

            wordHtml += `</div></body></html>\n\n`;
            
            // Ajout du bloc MHTML pour attacher la ressource du Logo
            attachedParts += `--${boundary}\n`;
            attachedParts += `Content-ID: <logo_officiel.png>\n`;
            attachedParts += `Content-Location: logo_officiel.png\n`;
            attachedParts += `Content-Transfer-Encoding: base64\n`;
            attachedParts += `Content-Type: image/png\n\n`;
            attachedParts += LOGO_BASE64 + "\n\n";

            let finalDoc = mhtml + wordHtml + attachedParts + `--${boundary}--`;

            let blob = new Blob([finalDoc], { type: 'application/vnd.ms-word;charset=utf-8' });
            let url = URL.createObjectURL(blob);
            
            let cleanSiteName = site.replace(/[^a-zA-Z0-9]/g, "_");
            let cleanDate = dateV.replace(/\//g, "-");
            let filename = `Rapport_Maintenance_${cleanSiteName}_${cleanDate}.doc`;

            let a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.style.display = 'none';
            document.body.appendChild(a);
            
            try { a.click(); } catch (err) { console.error(err); }
            
            setTimeout(() => {
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }, 300);
        });
    </script>
</body>
</html>
